<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام المحاسبة — Gaty</title>
<script>
(function(){var stamp=localStorage.getItem('gaty_apps_gate');if(!stamp||Date.now()-Number(stamp)>=3600000)location.replace('index.html')})()
</script>
<style>
:root{--brand:#714B67;--brand2:#5B3A54;--teal:#017E84;--ink:#25232b;--muted:#726d78;--line:#e5e1e7;--bg:#f7f6f8;--paper:#fff;--red:#c4424d;--green:#16764b;--shadow:0 5px 20px #34233812;font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);background:var(--bg)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1400px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.title h1{font-size:25px;margin:0 0 4px;color:var(--brand)}.title p{margin:0;color:var(--muted)}.actions,.tabs,.row-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:9px;font-weight:650}.btn:hover{border-color:var(--brand);color:var(--brand)}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.teal{background:var(--teal);color:white;border-color:var(--teal)}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}.tabs{background:#fff;padding:7px;border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:auto;flex-wrap:nowrap}.tab{border:0;background:transparent;padding:10px 16px;border-radius:8px;white-space:nowrap;color:var(--muted);font-weight:700}.tab.active{background:var(--brand);color:#fff}.notice{border:1px solid #f0d9ab;background:#fff9eb;color:#66480d;border-radius:10px;padding:10px 13px;margin:12px 0}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:15px}.cols{grid-template-columns:1.2fr .8fr}.card{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:var(--shadow);min-width:0}.card h2{font-size:17px;margin:0 0 13px}.kpi-label{color:var(--muted);font-size:13px}.kpi-value{font-size:25px;font-weight:800;margin-top:5px;direction:ltr;text-align:right}.kpi-value.pos{color:var(--green)}.kpi-value.neg{color:var(--red)}.field-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-weight:700;font-size:12px;color:var(--muted)}.input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 10px;color:var(--ink);min-width:0}.input:focus,select:focus,textarea:focus{outline:2px solid #714b6733;border-color:var(--brand)}.inline{display:flex;align-items:end;gap:10px;flex-wrap:wrap}.inline>.field{flex:1;min-width:150px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{background:#f7f4f7;color:#5f5361;font-size:12px;position:sticky;top:0}tbody tr:last-child td{border-bottom:0}.num{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.empty{text-align:center;padding:25px;color:var(--muted)}.status{display:inline-block;border-radius:20px;padding:4px 9px;font-size:11px;background:#e8f5ee;color:var(--green);font-weight:700}.lines{display:grid;gap:8px}.line{display:grid;grid-template-columns:minmax(200px,1.7fr) 1fr 1fr auto;gap:8px;align-items:center}.line-head{font-size:11px;color:var(--muted);font-weight:700}.totals{display:flex;gap:20px;justify-content:flex-end;padding:12px 4px;font-weight:750}.total-bad{color:var(--red)}.total-good{color:var(--green)}.section{display:none}.section.active{display:block}.account-type{font-size:11px;color:var(--muted)}.report-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.report-tabs button{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:8px}.report-tabs button.active{color:white;background:var(--teal);border-color:var(--teal)}.report-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.footer-note{font-size:12px;color:var(--muted);margin-top:14px}.modal{position:fixed;inset:0;background:#17121c77;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.show{display:flex}.modal-box{background:white;border-radius:14px;padding:20px;width:min(520px,100%);box-shadow:var(--shadow)}.modal-box h2{margin:0 0 14px}.toast{position:fixed;bottom:18px;inset-inline-start:18px;background:#24202a;color:#fff;padding:11px 16px;border-radius:9px;display:none;z-index:20}.toast.show{display:block}.credit{color:var(--red)}.debit{color:var(--green)}@media(max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}.field-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.wrap{padding:12px}.top{align-items:flex-start;flex-direction:column}.kpis{gap:8px}.card{padding:12px}.line{grid-template-columns:1fr 1fr 1fr auto}.line select{grid-column:1/-1;grid-row:1}.line input{grid-row:2}.line .del{grid-row:2}.line-head{display:none}.field-grid{grid-template-columns:1fr 1fr}.title h1{font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="title"><h1 id="appTitle">نظام المحاسبة</h1><p id="subtitle">دفتر يومية مزدوج القيد وتقارير مالية — البيانات محفوظة في هذا المتصفح</p></div><div class="actions"><button class="btn" onclick="exportBackup()">تنزيل نسخة احتياطية</button><button class="btn" onclick="document.getElementById('importFile').click()">استعادة نسخة</button><input id="importFile" type="file" accept="application/json,.json" hidden onchange="importBackup(this)"><button class="btn" onclick="goBack()">العودة إلى اللوحة</button></div></header>
<div class="notice" id="storageNotice">تُحفظ البيانات على هذا الجهاز والمتصفح فقط. استخدم «تنزيل نسخة احتياطية» بانتظام؛ مسح بيانات المتصفح قد يحذفها.</div>
<nav class="tabs" id="tabs"></nav>
<section class="section active" id="sec-home"></section>
<section class="section" id="sec-entry"></section>
<section class="section" id="sec-journal"></section>
<section class="section" id="sec-accounts"></section>
<section class="section" id="sec-reports"></section>
<div class="footer-note" id="footer"></div>
</div>
<div class="modal" id="accountModal"><div class="modal-box"><h2 id="accountModalTitle">إضافة حساب</h2><div class="field-grid" style="grid-template-columns:1fr 1fr"><div class="field"><label>رمز الحساب</label><input class="input" id="accCode"></div><div class="field"><label>اسم الحساب</label><input class="input" id="accName"></div><div class="field" style="grid-column:1/-1"><label>نوع الحساب</label><select id="accType"></select></div></div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button class="btn" onclick="closeAccountModal()">إلغاء</button><button class="btn primary" onclick="saveAccount()">حفظ الحساب</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const STORE='gaty_accounting_v1', CURRENCY='SAR';
const TYPES={asset:'الأصول',liability:'الالتزامات',equity:'حقوق الملكية',revenue:'الإيرادات',expense:'المصروفات'};
const SEED=[['1000','النقدية','asset'],['1100','العملاء / ذمم مدينة','asset'],['1200','المخزون','asset'],['1500','الأصول الثابتة','asset'],['2000','الموردون / ذمم دائنة','liability'],['2100','مصروفات مستحقة','liability'],['3000','رأس المال','equity'],['3100','الأرباح المبقاة','equity'],['4000','المبيعات','revenue'],['4100','إيرادات أخرى','revenue'],['5000','تكلفة البضاعة المباعة','expense'],['6000','مصروفات الرواتب','expense'],['6100','مصروف الإيجار','expense'],['6200','مصروفات الخدمات','expense'],['6300','مصروفات أخرى','expense']].map(([code,name,type])=>({id:crypto.randomUUID(),code,name,type,active:true}));
function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
let db=load(), page='home', report='trial', selectedAccount='', editAccountId=null, journalDraft=[], reportFrom=localDate(new Date(new Date().getFullYear(),0,1)), reportTo=localDate(new Date());
function emptyDb(){return{version:1,currency:CURRENCY,accounts:SEED,journals:[]}}
function load(){try{const v=JSON.parse(localStorage.getItem(STORE));if(v&&Array.isArray(v.accounts)&&Array.isArray(v.journals))return v}catch(e){}return emptyDb()}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(db));return true}catch(e){toast('تعذر الحفظ: مساحة التخزين ممتلئة');return false}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(v){return new Intl.NumberFormat('ar-SA',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v)||0)+' ر.س'}
function nav(){const items=[['home','لوحة التحكم'],['entry','قيد يومية جديد'],['journal','دفتر اليومية'],['accounts','دليل الحسابات'],['reports','التقارير']];document.getElementById('tabs').innerHTML=items.map(([id,label])=>`<button class="tab ${page===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('');document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById('sec-'+page).classList.add('active');document.getElementById('footer').textContent=`عدد القيود: ${db.journals.length} • عدد الحسابات: ${db.accounts.length} • العملة: ${db.currency||CURRENCY}`}
function go(p){page=p;render()}
function goBack(){location.href='index.html'}
function typeName(t){return TYPES[t]||t}
function allLines(){return db.journals.flatMap(j=>j.lines.map(l=>({...l,date:j.date,ref:j.ref,description:j.description,journalId:j.id})))}
function periodLines(){return allLines().filter(l=>(!reportFrom||l.date>=reportFrom)&&(!reportTo||l.date<=reportTo))}
function asOfLines(){return allLines().filter(l=>!reportTo||l.date<=reportTo)}
function totals(lines=allLines()){return lines.reduce((a,l)=>{a.debit+=Number(l.debit)||0;a.credit+=Number(l.credit)||0;return a},{debit:0,credit:0})}
function balanceByAccount(lines=allLines()){const m={};for(const a of db.accounts)m[a.id]={debit:0,credit:0};for(const l of lines){if(!m[l.accountId])m[l.accountId]={debit:0,credit:0};m[l.accountId].debit+=Number(l.debit)||0;m[l.accountId].credit+=Number(l.credit)||0}return m}
function normalBalance(a,b){return ['liability','equity','revenue'].includes(a.type)?b.credit-b.debit:b.debit-b.credit}
function render(){nav();renderHome();renderEntry();renderJournal();renderAccounts();renderReports()}
function renderHome(){const e=document.getElementById('sec-home'), all=allLines(), t=totals(all), b=balanceByAccount(all), income=netIncome(all), assets=sumType('asset',all), liabilities=sumType('liability',all), equity=sumType('equity',all)+income;const recent=db.journals.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,7);e.innerHTML=`<div class="grid kpis"><div class="card"><div class="kpi-label">إجمالي الأصول</div><div class="kpi-value">${money(assets)}</div></div><div class="card"><div class="kpi-label">الإيرادات</div><div class="kpi-value pos">${money(sumType('revenue',all))}</div></div><div class="card"><div class="kpi-label">صافي الربح / (الخسارة)</div><div class="kpi-value ${income>=0?'pos':'neg'}">${money(income)}</div></div><div class="card"><div class="kpi-label">القيود المسجلة</div><div class="kpi-value">${db.journals.length}</div></div></div><div class="grid cols"><div class="card"><div class="report-head"><h2>أحدث قيود اليومية</h2><button class="btn small" onclick="go('journal')">عرض دفتر اليومية</button></div>${recent.length?`<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>المرجع</th><th>البيان</th><th>مدين</th><th>دائن</th></tr></thead><tbody>${recent.map(j=>`<tr><td>${esc(j.date)}</td><td>${esc(j.ref)}</td><td>${esc(j.description)}</td><td class="num">${money(totals(j.lines).debit)}</td><td class="num">${money(totals(j.lines).credit)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">لا توجد قيود بعد. ابدأ بتسجيل قيد يومية.</div>`}</div><div class="card"><h2>ملخص المركز المالي</h2><table style="min-width:0"><tbody><tr><td>الأصول</td><td class="num">${money(assets)}</td></tr><tr><td>الالتزامات</td><td class="num">${money(liabilities)}</td></tr><tr><td>حقوق الملكية مع نتيجة الفترة</td><td class="num">${money(equity)}</td></tr><tr><td><strong>الفرق (يجب أن يساوي صفرًا)</strong></td><td class="num"><strong>${money(assets-liabilities-equity)}</strong></td></tr></tbody></table><p class="footer-note">سجّل الأرصدة الافتتاحية كقيد يومية متوازن من تبويب «قيد يومية جديد».</p></div></div>`}
function sumType(type,lines=allLines()){const b=balanceByAccount(lines);return db.accounts.filter(a=>a.type===type).reduce((s,a)=>s+normalBalance(a,b[a.id]||{debit:0,credit:0}),0)}
function netIncome(lines=allLines()){return sumType('revenue',lines)-sumType('expense',lines)}
function activeAccounts(){return db.accounts.filter(a=>a.active!==false).slice().sort((a,b)=>a.code.localeCompare(b.code,'en'))}
function accountOptions(id=''){return `<option value="">اختر الحساب</option>${activeAccounts().map(a=>`<option value="${a.id}" ${a.id===id?'selected':''}>${esc(a.code)} — ${esc(a.name)} (${typeName(a.type)})</option>`).join('')}`}
function blankLine(){return{accountId:'',debit:'',credit:''}}
function startJournal(){document.getElementById('jeDate').value=localDate(new Date());document.getElementById('jeRef').value=nextRef();document.getElementById('jeDesc').value='';journalDraft=[blankLine(),blankLine()];renderLines()}
function nextRef(){const y=new Date().getFullYear(),n=String(db.journals.filter(j=>j.date?.startsWith(String(y))).length+1).padStart(3,'0');return`JE-${y}-${n}`}
function renderEntry(){const e=document.getElementById('sec-entry');e.innerHTML=`<div class="card"><div class="report-head"><div><h2>تسجيل قيد يومية</h2><div class="muted">كل قيد يجب أن يتوازن: إجمالي المدين = إجمالي الدائن.</div></div></div><div class="field-grid" style="margin:14px 0"><div class="field"><label>التاريخ</label><input class="input" id="jeDate" type="date"></div><div class="field"><label>رقم المرجع</label><input class="input" id="jeRef"></div><div class="field" style="grid-column:span 2"><label>البيان</label><input class="input" id="jeDesc" placeholder="مثال: إثبات مصروف إيجار شهر أكتوبر"></div></div><div class="line line-head"><span>الحساب</span><span>مدين</span><span>دائن</span><span></span></div><div class="lines" id="journalLines"></div><div class="totals" id="jeTotals"></div><div class="actions" style="justify-content:space-between;margin-top:12px"><button class="btn" onclick="addJournalLine()">＋ إضافة سطر</button><button class="btn primary" onclick="postJournal()">ترحيل القيد</button></div></div><div class="card" style="margin-top:14px"><h2>ملاحظة للأرصدة الافتتاحية</h2><div class="muted">أدخل الأرصدة الافتتاحية كقيد متوازن بتاريخ بداية الفترة، مثل: مدين النقدية/المخزون، ودائن رأس المال أو الأرباح المبقاة.</div></div>`;startJournal()}
function renderLines(){const host=document.getElementById('journalLines');if(!host)return;host.innerHTML=journalDraft.map((l,i)=>`<div class="line"><select onchange="journalDraft[${i}].accountId=this.value">${accountOptions(l.accountId)}</select><input class="input num" type="number" min="0" step="0.01" placeholder="0.00" value="${esc(l.debit)}" oninput="setLineAmount(${i},'debit',this.value)"><input class="input num" type="number" min="0" step="0.01" placeholder="0.00" value="${esc(l.credit)}" oninput="setLineAmount(${i},'credit',this.value)"><button class="btn small danger del" onclick="removeJournalLine(${i})" title="حذف السطر">×</button></div>`).join('');updateJournalTotals()}
function updateJournalTotals(){const t=totals(journalDraft),ok=Math.abs(t.debit-t.credit)<0.005&&t.debit>0;document.getElementById('jeTotals').innerHTML=`<span>المدين: ${money(t.debit)}</span><span>الدائن: ${money(t.credit)}</span><span class="${ok?'total-good':'total-bad'}">${ok?'متوازن':'غير متوازن'}</span>`}
function setLineAmount(i,side,v){journalDraft[i][side]=v;const other=side==='debit'?'credit':'debit';journalDraft[i][other]='';const row=document.getElementById('journalLines').children[i],inputs=row.querySelectorAll('input');inputs[other==='debit'?0:1].value='';updateJournalTotals()}
function addJournalLine(){journalDraft.push(blankLine());renderLines()}
function removeJournalLine(i){if(journalDraft.length<=2)return toast('يلزم سطران على الأقل');journalDraft.splice(i,1);renderLines()}
function postJournal(){const date=document.getElementById('jeDate').value,ref=document.getElementById('jeRef').value.trim(),description=document.getElementById('jeDesc').value.trim(),entered=journalDraft.filter(l=>l.accountId||l.debit||l.credit),lines=entered.map(l=>({accountId:l.accountId,debit:Number(l.debit)||0,credit:Number(l.credit)||0})),t=totals(lines);if(!date||!ref||!description)return toast('أكمل التاريخ والمرجع والبيان');if(lines.length<2)return toast('أدخل سطرين حسابيين على الأقل');if(lines.some(l=>!l.accountId||!Number.isFinite(l.debit)||!Number.isFinite(l.credit)||l.debit<0||l.credit<0||((l.debit>0)===(l.credit>0))))return toast('كل سطر يحتاج حسابًا ومبلغًا في جهة واحدة فقط');if(Math.abs(t.debit-t.credit)>=0.005||t.debit<=0)return toast('القيد غير متوازن؛ راجع مبالغ المدين والدائن');if(db.journals.some(j=>j.ref===ref))return toast('رقم المرجع مستخدم من قبل');if(!confirm('ترحيل القيد '+ref+'؟ بعد الترحيل، احذفه وأعد تسجيله لتصحيح أي خطأ.'))return;db.journals.push({id:crypto.randomUUID(),date,ref,description,lines,createdAt:new Date().toISOString()});persist();toast('تم ترحيل القيد');go('journal')}
function renderJournal(){const e=document.getElementById('sec-journal');const rows=db.journals.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.ref.localeCompare(a.ref));e.innerHTML=`<div class="card"><div class="report-head"><div><h2>دفتر اليومية (${rows.length})</h2><div class="muted">كل قيد مرحّل محفوظ كسجل محاسبي متوازن.</div></div><button class="btn primary" onclick="go('entry')">＋ قيد جديد</button></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>المرجع</th><th>البيان</th><th>عدد السطور</th><th>المدين</th><th>الدائن</th><th>إجراء</th></tr></thead><tbody>${rows.length?rows.map(j=>`<tr><td>${esc(j.date)}</td><td>${esc(j.ref)}</td><td>${esc(j.description)}</td><td>${j.lines.length}</td><td class="num">${money(totals(j.lines).debit)}</td><td class="num">${money(totals(j.lines).credit)}</td><td><button class="btn small danger" onclick="deleteJournal('${j.id}')">حذف</button></td></tr>`).join(''):`<tr><td colspan="7" class="empty">لا توجد قيود مسجلة.</td></tr>`}</tbody></table></div></div>`}
function deleteJournal(id){const j=db.journals.find(x=>x.id===id);if(!j||!confirm(`حذف القيد ${j.ref}؟ سيُعاد احتساب التقارير بعد الحذف.`))return;db.journals=db.journals.filter(x=>x.id!==id);persist();render();toast('تم حذف القيد')}
function renderAccounts(){const e=document.getElementById('sec-accounts'),accounts=db.accounts.slice().sort((a,b)=>a.code.localeCompare(b.code,'en')),b=balanceByAccount();e.innerHTML=`<div class="card"><div class="report-head"><div><h2>دليل الحسابات</h2><div class="muted">أنشئ الحسابات التشغيلية المطلوبة؛ لا يمكن حذف حساب مستخدم في القيود.</div></div><button class="btn primary" onclick="openAccountModal()">＋ إضافة حساب</button></div><div class="table-wrap"><table><thead><tr><th>الرمز</th><th>اسم الحساب</th><th>التصنيف</th><th>الرصيد الطبيعي</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>${accounts.map(a=>`<tr><td>${esc(a.code)}</td><td>${esc(a.name)}</td><td>${typeName(a.type)}</td><td class="num">${money(Math.abs(normalBalance(a,b[a.id]||{debit:0,credit:0})))}</td><td><span class="status">${a.active===false?'موقوف':'نشط'}</span></td><td><div class="row-actions"><button class="btn small" onclick="openAccountModal('${a.id}')">تعديل</button><button class="btn small danger" onclick="toggleAccount('${a.id}')">${a.active===false?'تفعيل':'إيقاف'}</button></div></td></tr>`).join('')}</tbody></table></div></div>`}
function openAccountModal(id=''){editAccountId=id||null;const a=id?db.accounts.find(x=>x.id===id):null;document.getElementById('accountModalTitle').textContent=a?'تعديل حساب':'إضافة حساب';document.getElementById('accCode').value=a?.code||'';document.getElementById('accName').value=a?.name||'';document.getElementById('accType').innerHTML=Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${a?.type===k?'selected':''}>${v}</option>`).join('');document.getElementById('accountModal').classList.add('show')}
function closeAccountModal(){document.getElementById('accountModal').classList.remove('show')}
function saveAccount(){const code=document.getElementById('accCode').value.trim(),name=document.getElementById('accName').value.trim(),type=document.getElementById('accType').value;if(!code||!name)return toast('أدخل رمز الحساب واسمه');if(db.accounts.some(a=>a.code===code&&a.id!==editAccountId))return toast('رمز الحساب مستخدم');if(editAccountId){const a=db.accounts.find(x=>x.id===editAccountId);Object.assign(a,{code,name,type})}else db.accounts.push({id:crypto.randomUUID(),code,name,type,active:true});persist();closeAccountModal();render();toast('تم حفظ الحساب')}
function toggleAccount(id){const a=db.accounts.find(x=>x.id===id);if(!a)return;if(a.active!==false&&db.journals.some(j=>j.lines.some(l=>l.accountId===id)))return toast('لا يمكن إيقاف حساب مستخدم في قيد؛ عدّل القيود أولًا');a.active=a.active===false;persist();render()}
function renderReports(){const e=document.getElementById('sec-reports');let body='';if(report==='trial')body=trialReport();if(report==='income')body=incomeReport();if(report==='balance')body=balanceReport();if(report==='ledger')body=ledgerReport();e.innerHTML=`<div class="card"><div class="report-head"><div><h2>التقارير المالية</h2><div class="muted">ميزان المراجعة والميزانية كما في تاريخ النهاية؛ قائمة الدخل والأستاذ ضمن الفترة.</div></div><button class="btn" onclick="exportReport()">تنزيل التقرير CSV</button></div><div class="inline" style="margin:10px 0 15px"><div class="field"><label>من تاريخ</label><input class="input" type="date" id="reportFrom" value="${reportFrom}"></div><div class="field"><label>إلى تاريخ</label><input class="input" type="date" id="reportTo" value="${reportTo}"></div><button class="btn teal" onclick="applyReportDates()">تحديث التقرير</button></div><div class="report-tabs">${[['trial','ميزان المراجعة'],['income','قائمة الدخل'],['balance','الميزانية العمومية'],['ledger','الأستاذ العام']].map(([id,n])=>`<button class="${report===id?'active':''}" onclick="setReport('${id}')">${n}</button>`).join('')}</div>${body}</div>`}
function applyReportDates(){reportFrom=document.getElementById('reportFrom').value;reportTo=document.getElementById('reportTo').value;if(reportFrom&&reportTo&&reportFrom>reportTo)return toast('تاريخ البداية يجب ألا يتجاوز تاريخ النهاية');renderReports()}
function setReport(r){report=r;renderReports()}
function trialReport(){const b=balanceByAccount(asOfLines()),rows=db.accounts.slice().sort((a,c)=>a.code.localeCompare(c.code,'en')).map(a=>{const raw=b[a.id]||{debit:0,credit:0},bal=normalBalance(a,raw);return{a,dr:bal>0?bal:0,cr:bal<0?-bal:0}}).filter(r=>r.dr||r.cr);const dr=rows.reduce((s,r)=>s+r.dr,0),cr=rows.reduce((s,r)=>s+r.cr,0);return `<div class="table-wrap"><table><thead><tr><th>رمز الحساب</th><th>الحساب</th><th>النوع</th><th>مدين</th><th>دائن</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.a.code)}</td><td>${esc(r.a.name)}</td><td>${typeName(r.a.type)}</td><td class="num">${money(r.dr)}</td><td class="num">${money(r.cr)}</td></tr>`).join('')||`<tr><td colspan="5" class="empty">لا توجد أرصدة؛ سجّل القيود أولًا.</td></tr>`}<tr><td colspan="3"><strong>الإجمالي</strong></td><td class="num"><strong>${money(dr)}</strong></td><td class="num"><strong>${money(cr)}</strong></td></tr></tbody></table></div><p class="footer-note">الفرق بين إجمالي ميزان المراجعة: ${money(dr-cr)}.</p>`}
function incomeReport(){const b=balanceByAccount(periodLines()),revs=db.accounts.filter(a=>a.type==='revenue').map(a=>({a,v:normalBalance(a,b[a.id]||{debit:0,credit:0})})).filter(x=>x.v),exps=db.accounts.filter(a=>a.type==='expense').map(a=>({a,v:normalBalance(a,b[a.id]||{debit:0,credit:0})})).filter(x=>x.v),rv=revs.reduce((s,x)=>s+x.v,0),ex=exps.reduce((s,x)=>s+x.v,0);return `<h3>الإيرادات</h3>${simpleAccountTable(revs)}<p class="totals">إجمالي الإيرادات: ${money(rv)}</p><h3>المصروفات</h3>${simpleAccountTable(exps)}<p class="totals">إجمالي المصروفات: ${money(ex)}</p><p class="totals ${rv-ex>=0?'total-good':'total-bad'}">صافي الربح / (الخسارة): ${money(rv-ex)}</p>`}
function simpleAccountTable(rows){return `<div class="table-wrap"><table style="min-width:0"><thead><tr><th>الحساب</th><th>المبلغ</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.a.code)} — ${esc(x.a.name)}</td><td class="num">${money(x.v)}</td></tr>`).join('')||`<tr><td colspan="2" class="empty">لا توجد أرصدة</td></tr>`}</tbody></table></div>`}
function balanceReport(){const b=balanceByAccount(asOfLines()),groups=['asset','liability','equity'].map(type=>({type,rows:db.accounts.filter(a=>a.type===type).map(a=>({a,v:normalBalance(a,b[a.id]||{debit:0,credit:0})})).filter(x=>x.v)})),inc=netIncome(asOfLines()),assets=groups[0].rows.reduce((s,x)=>s+x.v,0),liabs=groups[1].rows.reduce((s,x)=>s+x.v,0),eq=groups[2].rows.reduce((s,x)=>s+x.v,0);return `${groups.map(g=>`<h3>${typeName(g.type)}</h3>${simpleAccountTable(g.rows)}`).join('')}<div class="table-wrap" style="margin-top:12px"><table style="min-width:0"><tbody><tr><td><strong>إجمالي الأصول</strong></td><td class="num">${money(assets)}</td></tr><tr><td><strong>إجمالي الالتزامات</strong></td><td class="num">${money(liabs)}</td></tr><tr><td>حقوق الملكية المسجلة</td><td class="num">${money(eq)}</td></tr><tr><td>نتيجة الأعمال غير المقفلة حتى تاريخ التقرير</td><td class="num">${money(inc)}</td></tr><tr><td><strong>الالتزامات وحقوق الملكية</strong></td><td class="num"><strong>${money(liabs+eq+inc)}</strong></td></tr></tbody></table></div><p class="footer-note">فرق التوازن: ${money(assets-liabs-eq-inc)} (يُفترض صفرًا إذا أُدخلت الأرصدة الافتتاحية والقيود كاملة).</p>`}
function ledgerReport(){const id=selectedAccount||activeAccounts()[0]?.id||'',acc=db.accounts.find(a=>a.id===id);selectedAccount=id;if(!acc)return '<div class="empty">أضف حسابًا إلى دليل الحسابات أولًا.</div>';const accountLines=allLines().filter(l=>l.accountId===id).sort((a,b)=>a.date.localeCompare(b.date)||a.ref.localeCompare(b.ref)),before=accountLines.filter(l=>reportFrom&&l.date<reportFrom),lines=accountLines.filter(l=>(!reportFrom||l.date>=reportFrom)&&(!reportTo||l.date<=reportTo));let run=before.reduce((s,l)=>s+normalBalance(acc,{debit:Number(l.debit)||0,credit:Number(l.credit)||0}),0);return `<div class="field" style="max-width:480px;margin-bottom:12px"><label>اختر الحساب</label><select onchange="selectedAccount=this.value;renderReports()">${activeAccounts().map(a=>`<option value="${a.id}" ${a.id===id?'selected':''}>${esc(a.code)} — ${esc(a.name)}</option>`).join('')}</select></div><div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>المرجع</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead><tbody>${before.length?`<tr><td>${esc(reportFrom)}</td><td>—</td><td>رصيد ما قبل الفترة</td><td class="num">—</td><td class="num">—</td><td class="num">${money(run)}</td></tr>`:''}${lines.map(l=>{run+=normalBalance(acc,{debit:Number(l.debit)||0,credit:Number(l.credit)||0});return `<tr><td>${esc(l.date)}</td><td>${esc(l.ref)}</td><td>${esc(l.description)}</td><td class="num">${money(l.debit)}</td><td class="num">${money(l.credit)}</td><td class="num">${money(run)}</td></tr>`}).join('')||`<tr><td colspan="6" class="empty">لا توجد حركات لهذا الحساب.</td></tr>`}<tr><td colspan="5"><strong>الرصيد الختامي</strong></td><td class="num"><strong>${money(run)}</strong></td></tr></tbody></table></div>`}
function exportReport(){let rows=[];if(report==='trial'){const b=balanceByAccount(asOfLines());rows=[['رمز','الحساب','النوع','مدين','دائن'],...db.accounts.map(a=>{let v=normalBalance(a,b[a.id]||{debit:0,credit:0});return[a.code,a.name,typeName(a.type),Math.max(v,0),Math.max(-v,0)]})]}else if(report==='ledger'){rows=[['التاريخ','المرجع','البيان','مدين','دائن'],...allLines().filter(l=>l.accountId===selectedAccount&&(!reportFrom||l.date>=reportFrom)&&(!reportTo||l.date<=reportTo)).map(l=>[l.date,l.ref,l.description,l.debit,l.credit])]}else if(report==='income'){const b=balanceByAccount(periodLines());rows=[['رمز الحساب','الحساب','النوع','الرصيد'],...db.accounts.filter(a=>['revenue','expense'].includes(a.type)).map(a=>[a.code,a.name,typeName(a.type),normalBalance(a,b[a.id]||{debit:0,credit:0})]),['','صافي الربح / (الخسارة)','',netIncome(periodLines())]]}else{const b=balanceByAccount(asOfLines());rows=[['رمز الحساب','الحساب','النوع','الرصيد'],...db.accounts.filter(a=>['asset','liability','equity'].includes(a.type)).map(a=>[a.code,a.name,typeName(a.type),normalBalance(a,b[a.id]||{debit:0,credit:0})]),['','نتيجة الأعمال غير المقفلة حتى تاريخ التقرير','',netIncome(asOfLines())]]}downloadCsv(rows,`gaty_accounting_${report}.csv`)}
function downloadCsv(rows,name){const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportBackup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`gaty_accounting_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importBackup(input){const file=input.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.accounts)||!Array.isArray(d.journals)||!confirm('استبدال بيانات المحاسبة الحالية بمحتوى النسخة الاحتياطية؟'))return;db={version:1,currency:d.currency||CURRENCY,accounts:d.accounts,journals:d.journals};persist();render();toast('تمت استعادة النسخة')}catch(e){toast('ملف النسخة الاحتياطية غير صالح')}input.value=''};r.readAsText(file)}
let toastTimer;function toast(msg){const e=document.getElementById('toast');e.textContent=msg;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2600)}
render();
</script>
</body></html>
