<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المشتريات والمخازن — Gaty</title>
<script>(function(){var s=localStorage.getItem('gaty_apps_gate');if(!s||Date.now()-Number(s)>=3600000)location.replace('index.html')})()</script>
<script src="xlsx.full.min.js"></script><style>
:root{font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;color:#25232b;background:#f7f6f8;--brand:#714b67;--line:#e5e1e7;--muted:#726d78}*{box-sizing:border-box}body{margin:0;font-size:14px}.wrap{max-width:1400px;margin:auto;padding:20px}.top,.head,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.top h1{color:var(--brand);margin:0}.muted{color:var(--muted)}.tabs{display:flex;gap:6px;overflow:auto;background:white;padding:7px;border:1px solid var(--line);border-radius:11px;margin:16px 0}.tab,.btn{border:1px solid var(--line);border-radius:8px;background:white;padding:9px 13px;cursor:pointer;font:inherit}.tab.active,.btn.primary{background:var(--brand);color:white;border-color:var(--brand)}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:13px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field label{color:var(--muted);font-size:12px;font-weight:700}input,select{font:inherit;padding:9px;border:1px solid var(--line);border-radius:7px;min-width:0}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:right;border-bottom:1px solid var(--line);padding:9px}th{color:var(--muted);background:#faf9fb}.num{direction:ltr;text-align:left}.notice{background:#fff9eb;padding:11px;border-radius:8px;margin:12px 0}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kpi{font-size:22px;font-weight:800;margin-top:6px}.small{padding:5px 8px}.danger{color:#b22}.lines{display:grid;gap:8px}.line{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:7px;align-items:center}.toast{position:fixed;bottom:20px;left:20px;background:#28232b;color:white;padding:12px 18px;border-radius:9px;display:none}.toast.show{display:block}@media(max-width:760px){.grid,.kpis{grid-template-columns:1fr 1fr}.line{grid-template-columns:1fr 1fr}.line>*:first-child{grid-column:span 2}}
</style></head><body><main class="wrap"><header class="top"><div><h1>المشتريات والمخازن</h1><div class="muted">أوامر الشراء المعتمدة ترحّل المخزون والقيد المحاسبي معًا.</div></div><div class="actions"><button class="btn" onclick="backup()">نسخة احتياطية</button><button class="btn" onclick="location.href='index.html'">العودة إلى اللوحة</button></div></header><div class="notice">البيانات محفوظة في هذا المتصفح فقط. اعمل نسخة احتياطية قبل نقل الجهاز أو مسح بيانات المتصفح.</div><nav class="tabs" id="tabs"></nav><div id="app"></div></main><div id="toast" class="toast"></div><script>
const KEY='gaty_accounting_v1', TYPES={asset:'الأصول',liability:'الالتزامات'};let db=read(),tab='home',draft=[];
function read(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.accounts)&&Array.isArray(d.journals)){d.warehouses||=[];d.items||=[];d.purchaseOrders||=[];d.stockMoves||=[];d.transfers||=[];d.settings||={};return d}}catch(e){}return{version:1,currency:'SAR',accounts:[],journals:[],warehouses:[],items:[],purchaseOrders:[],stockMoves:[],transfers:[],settings:{}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function id(){return crypto.randomUUID()}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(x){return new Intl.NumberFormat('ar-SA',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(x)||0)+' ر.س'}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}
function ensure(){let defs=[['1200','مخزون مواد خام'],['1210','مخزون تحت التشغيل'],['1220','مخزون إنتاج تام'],['1230','مخزون المعرض']];for(let [code,name] of defs)if(!db.accounts.some(a=>a.code===code))db.accounts.push({id:id(),code,name,type:'asset',active:true});for(let [code,name]of [['2000','الموردون / ذمم دائنة']])if(!db.accounts.some(a=>a.code===code))db.accounts.push({id:id(),code,name,type:'liability',active:true});if(!db.warehouses.length){let root={id:id(),name:'المخازن',parentId:'',accountId:'',active:true};db.warehouses.push(root);for(let [i,name]of ['مخزن المواد الخام','مخزن تحت التشغيل','مخزن الإنتاج التام','المعرض'].entries())db.warehouses.push({id:id(),name,parentId:root.id,accountId:db.accounts.find(a=>a.code===['1200','1210','1220','1230'][i]).id,active:true})}save()}ensure();
const invAccounts=()=>db.accounts.filter(a=>a.type==='asset'&&a.active!==false),apAccounts=()=>db.accounts.filter(a=>a.type==='liability'&&a.active!==false),leaves=()=>db.warehouses.filter(w=>w.active!==false&&!db.warehouses.some(c=>c.parentId===w.id));
function nav(){let xs=[['home','ملخص'],['warehouses','شجرة المخازن'],['items','الأصناف'],['purchases','أوامر الشراء'],['transfers','تحويل بين المخازن'],['stock','الأرصدة']];document.getElementById('tabs').innerHTML=xs.map(([k,v])=>`<button class="tab ${tab===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');render()}function go(k){tab=k;nav()}function render(){let f={home:home,warehouses:warehousePage,items:itemPage,purchases:purchasePage,transfers:transferPage,stock:stockPage}[tab];document.getElementById('app').innerHTML=f()}
function home(){let val=stockRows().reduce((s,r)=>s+r.value,0),pending=db.purchaseOrders.filter(p=>p.status==='pending').length;return `<div class="kpis"><section class="card"><div class="muted">قيمة المخزون</div><div class="kpi">${money(val)}</div></section><section class="card"><div class="muted">أوامر بانتظار الاعتماد</div><div class="kpi">${pending}</div></section><section class="card"><div class="muted">الأصناف / المخازن</div><div class="kpi">${db.items.length} / ${leaves().length}</div></section></div><section class="card"><h3>مسار التوريد والترحيل</h3><p>أنشئ الصنف والمخزن واربط حساب المخزون. احفظ أمر الشراء كمسودة أو أرسله للاعتماد. عند الاعتماد يُضاف الرصيد ويُنشأ قيد مدين للمخزون ودائن للموردين.</p><p>التحويل يحسب متوسط التكلفة المتحرك من رصيد المخزن المصدر ويُحدّث قيمة كل مخزن.</p></section>`}
function accountOpts(selected='',type='asset'){return db.accounts.filter(a=>a.type===type&&a.active!==false).map(a=>`<option value="${a.id}" ${a.id===selected?'selected':''}>${esc(a.code)} — ${esc(a.name)}</option>`).join('')}
function warehouseOpts(sel=''){return leaves().map(w=>`<option value="${w.id}" ${w.id===sel?'selected':''}>${esc(w.name)}</option>`).join('')}
function warehousePage(){return `<section class="card"><div class="head"><h2>شجرة المخازن وربط الحسابات</h2><button class="btn primary" onclick="addWarehouse()">＋ مخزن / مستوى فرعي</button></div><p class="muted">اختر الأب لإنشاء مستوى فرعي، واربط كل مخزن فعلي بحساب مخزون من نوع الأصول.</p><div class="tablewrap"><table><thead><tr><th>المخزن</th><th>الأب</th><th>حساب المخزون</th><th>إجراء</th></tr></thead><tbody>${db.warehouses.map(w=>`<tr><td>${w.parentId?'└ ':''}${esc(w.name)}</td><td>${esc(db.warehouses.find(x=>x.id===w.parentId)?.name||'—')}</td><td><select onchange="mapWarehouse('${w.id}',this.value)"><option value="">اختر الحساب</option>${accountOpts(w.accountId)}</select></td><td><button class="btn small" onclick="renameWarehouse('${w.id}')">تعديل الاسم</button></td></tr>`).join('')}</tbody></table></div></section>`}
function addWarehouse(){let parent=prompt('اسم المخزن الأب؟ اتركه فارغًا للجذر: '+db.warehouses.map(w=>w.name).join('،'));if(parent===null)return;let p=db.warehouses.find(w=>w.name===parent.trim());if(parent.trim()&&!p)return toast('لم يتم العثور على المخزن الأب');let name=prompt('اسم المخزن الجديد');if(!name?.trim())return;db.warehouses.push({id:id(),name:name.trim(),parentId:p?.id||'',accountId:'',active:true});save();nav()}function renameWarehouse(i){let w=db.warehouses.find(x=>x.id===i),n=prompt('الاسم الجديد',w.name);if(n?.trim()){w.name=n.trim();save();nav()}}function mapWarehouse(i,a){db.warehouses.find(w=>w.id===i).accountId=a;save();toast('تم تحديث الربط')}
function itemPage(){return `<section class="card"><div class="head"><h2>الأصناف</h2><div class="actions"><label class="btn">استيراد Excel / CSV <input type="file" accept=".xlsx,.xls,.csv" hidden onchange="importItems(this)"></label><button class="btn primary" onclick="addItem()">＋ إضافة صنف</button></div></div><p class="muted">يمكن استيراد قائمة الأصناف؛ طابق أعمدة رمز الصنف واسمه عند الطلب.</p><div class="tablewrap"><table><thead><tr><th>الرمز</th><th>اسم الصنف</th><th>الوحدة</th></tr></thead><tbody>${db.items.map(i=>`<tr><td>${esc(i.code)}</td><td>${esc(i.name)}</td><td>${esc(i.unit)}</td></tr>`).join('')||'<tr><td colspan="3">لا توجد أصناف.</td></tr>'}</tbody></table></div></section>`}
function addItem(){let code=prompt('رمز الصنف');if(!code?.trim())return;let name=prompt('اسم الصنف');if(!name?.trim())return;if(db.items.some(i=>i.code===code.trim()))return toast('رمز الصنف موجود');db.items.push({id:id(),code:code.trim(),name:name.trim(),unit:prompt('الوحدة','حبة')||'حبة'});save();nav()}
function importItems(input){let file=input.files?.[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let wb=XLSX.read(r.result,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});if(!rows.length)throw 0;let keys=Object.keys(rows[0]),pick=(arr)=>keys.find(k=>arr.some(x=>String(k).toLowerCase().includes(x)));let ck=pick(['رمز','كود','code','item no']),nk=pick(['اسم الصنف','الوصف','name','description']),uk=pick(['الوحدة','unit']);if(!ck||!nk){let map=prompt('أسماء الأعمدة المتاحة:\n'+keys.join(' | ')+'\nاكتب اسم عمود الرمز ثم فاصلة ثم اسم عمود الاسم',keys.slice(0,2).join(','));if(!map)return;[ck,nk]=map.split(',').map(x=>x.trim())}let count=0;for(let row of rows){let code=String(row[ck]||'').trim(),name=String(row[nk]||'').trim();if(!code||!name)continue;let old=db.items.find(i=>i.code===code);if(old){old.name=name;if(uk)old.unit=String(row[uk]||old.unit)}else db.items.push({id:id(),code,name,unit:uk?String(row[uk]||''):'حبة'});count++}save();toast(`تم استيراد ${count} صنف`);nav()}catch(e){toast('تعذرت قراءة الملف')}input.value=''};r.readAsArrayBuffer(file)}
function purchasePage(){let rows=db.purchaseOrders.slice().reverse();return `<section class="card"><div class="head"><h2>أوامر الشراء</h2><button class="btn primary" onclick="newPO()">＋ أمر شراء</button></div><div class="tablewrap"><table><thead><tr><th>المرجع</th><th>المورد</th><th>التاريخ</th><th>القيمة</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${esc(p.ref)}</td><td>${esc(p.supplier)}</td><td>${esc(p.date)}</td><td>${money(total(p.lines))}</td><td>${status(p.status)}</td><td>${p.status==='draft'?`<button class="btn small" onclick="submitPO('${p.id}')">إرسال للاعتماد</button>`:''}${p.status==='pending'?`<button class="btn small primary" onclick="approvePO('${p.id}')">اعتماد وترحيل</button> <button class="btn small" onclick="rejectPO('${p.id}')">رفض</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6">لا توجد أوامر شراء.</td></tr>'}</tbody></table></div></section>`}
function status(s){return({draft:'مسودة',pending:'بانتظار الاعتماد',posted:'مرحّل',rejected:'مرفوض'})[s]||s}function total(ls){return Math.round(ls.reduce((s,l)=>s+l.qty*l.cost,0)*100)/100}
function newPO(){draft=[];let root=document.createElement('div');root.className='card';root.id='newpo';root.innerHTML=`<h2>أمر شراء جديد</h2><div class="grid"><label class="field">المورد<input id="supplier"></label><label class="field">التاريخ<input type="date" id="podate" value="${new Date().toISOString().slice(0,10)}"></label><label class="field">حساب الموردين<select id="ap">${accountOpts(db.settings.apAccountId,'liability')}</select></label></div><h3>الأصناف</h3><div id="polines" class="lines"></div><div class="actions" style="margin-top:10px"><button class="btn" onclick="addPOLine()">إضافة سطر</button><button class="btn" onclick="savePO('draft')">حفظ مسودة</button><button class="btn primary" onclick="savePO('pending')">إرسال للاعتماد</button><button class="btn" onclick="document.getElementById('newpo').remove()">إلغاء</button></div>`;document.getElementById('app').prepend(root);addPOLine()}
function addPOLine(){draft.push({});renderPOLines()}function renderPOLines(){let e=document.getElementById('polines');if(!e)return;e.innerHTML=draft.map((l,i)=>`<div class="line"><select onchange="draft[${i}].itemId=this.value"><option value="">الصنف</option>${db.items.map(x=>`<option value="${x.id}" ${x.id===l.itemId?'selected':''}>${esc(x.code)} — ${esc(x.name)}</option>`).join('')}</select><select onchange="draft[${i}].warehouseId=this.value"><option value="">المخزن</option>${warehouseOpts(l.warehouseId)}</select><input type="number" min="0.001" step="any" placeholder="الكمية" value="${l.qty||''}" oninput="draft[${i}].qty=Number(this.value)"><input type="number" min="0" step="0.01" placeholder="تكلفة الوحدة" value="${l.cost||''}" oninput="draft[${i}].cost=Number(this.value)"><button class="btn small" onclick="draft.splice(${i},1);renderPOLines()">×</button></div>`).join('')}
function savePO(state){let supplier=document.getElementById('supplier').value.trim(),date=document.getElementById('podate').value,ap=document.getElementById('ap').value,lines=draft.filter(l=>l.itemId&&l.warehouseId&&l.qty>0&&l.cost>=0);if(!supplier||!date||!ap||!lines.length)return toast('أكمل المورد والتاريخ والحساب وسطور الأصناف');if(lines.some(l=>!db.warehouses.find(w=>w.id===l.warehouseId)?.accountId))return toast('اربط كل مخزن بحساب مخزون أولًا');db.settings.apAccountId=ap;db.purchaseOrders.push({id:id(),ref:'PO-'+Date.now(),supplier,date,apAccountId:ap,lines:JSON.parse(JSON.stringify(lines)),status:state,createdAt:new Date().toISOString()});save();nav();toast(state==='draft'?'حُفظت المسودة':'أُرسل الأمر للاعتماد')}
function submitPO(i){let p=db.purchaseOrders.find(x=>x.id===i);p.status='pending';save();nav()}function rejectPO(i){let p=db.purchaseOrders.find(x=>x.id===i);if(confirm('رفض أمر الشراء؟')){p.status='rejected';save();nav()}}
function approvePO(i){let p=db.purchaseOrders.find(x=>x.id===i);if(!p||p.status!=='pending')return;if(!confirm(`اعتماد ${p.ref} وترحيل المخزون والقيد؟`))return;let sums={};for(let l of p.lines){let w=db.warehouses.find(x=>x.id===l.warehouseId);sums[w.accountId]=(sums[w.accountId]||0)+Math.round(l.qty*l.cost*100)/100}let amount=Object.values(sums).reduce((a,b)=>a+b,0);if(amount<=0)return toast('قيمة الأمر يجب أن تكون أكبر من صفر');let lines=Object.entries(sums).map(([accountId,debit])=>({accountId,debit,credit:0}));lines.push({accountId:p.apAccountId,debit:0,credit:amount});let j={id:id(),date:p.date,ref:'GRN-'+p.ref,description:`استلام أمر شراء ${p.ref} — ${p.supplier}`,lines,createdAt:new Date().toISOString()};db.journals.push(j);for(let l of p.lines)db.stockMoves.push({id:id(),date:p.date,type:'purchase',ref:p.ref,itemId:l.itemId,warehouseId:l.warehouseId,qty:l.qty,value:Math.round(l.qty*l.cost*100)/100,journalId:j.id});p.status='posted';p.journalId=j.id;p.approvedAt=new Date().toISOString();p.approvedBy=prompt('اسم المعتمد (اختياري)')||'';save();nav();toast('تم الاعتماد والترحيل')}
function stockRows(){let map={};for(let m of db.stockMoves){let k=m.itemId+'|'+m.warehouseId;map[k]||={itemId:m.itemId,warehouseId:m.warehouseId,qty:0,value:0};map[k].qty+=m.qty;map[k].value+=m.value}return Object.values(map).map(r=>({...r,avg:r.qty? r.value/r.qty:0})).filter(r=>Math.abs(r.qty)>0.000001)}
function transferPage(){return `<section class="card"><h2>تحويل مخزني</h2><p class="muted">يُستخدم متوسط تكلفة رصيد الصنف في المخزن المصدر. يتطلب الرصيد المتاح كفاية الكمية.</p><div class="grid"><label class="field">الصنف<select id="ti">${db.items.map(i=>`<option value="${i.id}">${esc(i.code)} — ${esc(i.name)}</option>`).join('')}</select></label><label class="field">من مخزن<select id="from">${warehouseOpts()}</select></label><label class="field">إلى مخزن<select id="to">${warehouseOpts()}</select></label><label class="field">الكمية<input id="tqty" type="number" min="0.001" step="any"></label></div><button class="btn primary" style="margin-top:12px" onclick="transfer()">تنفيذ التحويل</button></section><section class="card"><h3>التحويلات المنفذة</h3><div class="tablewrap"><table><thead><tr><th>المرجع</th><th>التاريخ</th><th>الصنف</th><th>من</th><th>إلى</th><th>الكمية</th><th>التكلفة</th></tr></thead><tbody>${db.transfers.slice().reverse().map(t=>`<tr><td>${esc(t.ref)}</td><td>${esc(t.date)}</td><td>${esc(db.items.find(i=>i.id===t.itemId)?.name)}</td><td>${esc(db.warehouses.find(w=>w.id===t.from)?.name)}</td><td>${esc(db.warehouses.find(w=>w.id===t.to)?.name)}</td><td>${t.qty}</td><td>${money(t.value)}</td></tr>`).join('')}</tbody></table></div></section>`}
function transfer(){let itemId=document.getElementById('ti').value,from=document.getElementById('from').value,to=document.getElementById('to').value,qty=Number(document.getElementById('tqty').value),r=stockRows().find(x=>x.itemId===itemId&&x.warehouseId===from);if(!itemId||!from||!to||from===to||!qty||qty<=0)return toast('تحقق من الصنف والمخازن والكمية');if(!r||r.qty+1e-8<qty)return toast('الرصيد المتاح غير كاف');let value=Math.round((r.value/r.qty)*qty*100)/100,ref='TR-'+Date.now(),date=new Date().toISOString().slice(0,10),j=null,a=db.warehouses.find(w=>w.id===from).accountId,b=db.warehouses.find(w=>w.id===to).accountId;if(!b)return toast('اربط مخزن الوجهة بحساب مخزون');if(a!==b){j={id:id(),date,ref:'JE-'+ref,description:`تحويل مخزني ${ref}`,lines:[{accountId:b,debit:value,credit:0},{accountId:a,debit:0,credit:value}],createdAt:new Date().toISOString()};db.journals.push(j)}db.stockMoves.push({id:id(),date,type:'transfer-out',ref,itemId,warehouseId:from,qty:-qty,value:-value,journalId:j?.id||''},{id:id(),date,type:'transfer-in',ref,itemId,warehouseId:to,qty,value,journalId:j?.id||''});db.transfers.push({id:id(),ref,date,itemId,from,to,qty,value});save();nav();toast('تم التحويل بمتوسط التكلفة المتحرك')}
function stockPage(){let rows=stockRows(),sub={},gl={};for(let r of rows){let a=db.warehouses.find(w=>w.id===r.warehouseId)?.accountId;if(a)sub[a]=(sub[a]||0)+r.value}for(let j of db.journals)for(let l of j.lines){let a=db.accounts.find(x=>x.id===l.accountId);if(a?.type==='asset')gl[l.accountId]=(gl[l.accountId]||0)+(Number(l.debit)||0)-(Number(l.credit)||0)}let linked=[...new Set(db.warehouses.map(w=>w.accountId).filter(Boolean))];return `<section class="card"><h2>أرصدة المخزون وتكلفته</h2><div class="tablewrap"><table><thead><tr><th>الصنف</th><th>المخزن</th><th>الكمية</th><th>متوسط التكلفة</th><th>القيمة</th><th>حساب الأستاذ</th></tr></thead><tbody>${rows.map(r=>{let w=db.warehouses.find(x=>x.id===r.warehouseId);return `<tr><td>${esc(db.items.find(i=>i.id===r.itemId)?.name)}</td><td>${esc(w?.name)}</td><td>${r.qty.toFixed(3)}</td><td class="num">${money(r.avg)}</td><td class="num">${money(r.value)}</td><td>${esc(db.accounts.find(a=>a.id===w?.accountId)?.code||'غير مربوط')}</td></tr>`}).join('')||'<tr><td colspan="6">لا توجد حركة مخزون مرحّلة بعد.</td></tr>'}</tbody></table></div><h3>مطابقة المخزون مع الأستاذ</h3><div class="tablewrap"><table><thead><tr><th>الحساب</th><th>قيمة المخزون الفرعي</th><th>رصيد الأستاذ</th><th>الفرق</th></tr></thead><tbody>${linked.map(a=>`<tr><td>${esc(db.accounts.find(x=>x.id===a)?.code)} — ${esc(db.accounts.find(x=>x.id===a)?.name)}</td><td class="num">${money(sub[a]||0)}</td><td class="num">${money(gl[a]||0)}</td><td class="num">${money((gl[a]||0)-(sub[a]||0))}</td></tr>`).join('')}</tbody></table></div><p class="muted">قيمة دفتر المخزون الفرعي تُحسب من أوامر الشراء والتحويلات المرحّلة في هذا النظام. فروقات الحساب قد تشمل قيودًا يدوية أو أرصدة افتتاحية؛ سجّل الحركات الافتتاحية المقابلة أيضًا.</p></section>`}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gaty_accounting_inventory_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}nav();
</script></body></html>
