st LEDGER_CREDIT_HEADERS = ['دائن', 'credit'];\n\nfunction parseLedgerDate(v) {\n  if (v instanceof Date && !isNaN(v)) return v;\n  if (typeof v === 'number') {\n    const epoch = Date.UTC(1899, 11, 30);\n    return new Date(epoch + v * 86400000);\n  }\n  if (typeof v === 'string') {\n    const s = v.trim();\n    const m = s.match(/^(\\d{1,2})[\\/\\-](\\d{1,2})[\\/\\-](\\d{2,4})$/);\n    if (m) {\n      let [, d, mo, y] = m;\n      if (y.length === 2) y = '20' + y;\n      return new Date(Date.UTC(+y, +mo - 1, +d));\n    }\n    const parsed = new Date(s);\n    if (!isNaN(parsed)) return parsed;\n  }\n  return null;\n}\n\n\nfunction loadWipOngoingPatterns() {\n  try {\n    const raw = localStorage.getItem(WIP_ONGOING_KEY);\n    if (raw) {\n      const parsed = JSON.parse(raw);\n      if (Array.isArray(parsed) && parsed.length >= 4) return parsed;\n    }\n  } catch (e) { /* ignore */ }\n  return WIP_ONGOING_DEFAULTS.slice();\n}\n\nfunction saveWipOngoingPatterns(patterns) {\n  try { localStorage.setItem(WIP_ONGOING_KEY, JSON.stringify(patterns)); } catch (e) { /* private mode — ignore */ }\n}\n\nstate.wipOngoingPatterns = loadWipOngoingPatterns();\n\nfunction loadWipCategories() {\n  try {\n    const raw = localStorage.getItem(WIP_CATEGORIES_KEY);\n    if (raw) {\n      const parsed = JSON.parse(raw);\n      if (Array.isArray(parsed) && parsed.length === 4) return parsed;\n    }\n  } catch (e) { /* ignore */ }\n  return WIP_CATEGORY_DEFAULTS.map(c => ({ label: c.label, match: c.match, value: c.value }));\n}\n\nfunction saveWipCategories(cats) {\n  try { localStorage.setItem(WIP_CATEGORIES_KEY, JSON.stringify(cats)); } catch (e) { /* private mode — ignore */ }\n}\n\nstate.wipCategories = loadWipCategories();\nstate.wipRows = null;\n\nconst WIP_MANUAL_OVERRIDES_KEY = 'gati_wip_manual_overrides_v1';\nconst WIP_LAST_UPDATED_KEY = 'gati_wip_last_updated_v1';\n\nfunction loadWipManualOverrides() {\n  try {\n    const raw = localStorage.getItem(WIP_MANUAL_OVERRIDES_KEY);\n    if (raw) return JSON.parse(raw);\n  } catch (e) { /* ignore */ }\n  return {};\n}\n\nfunction saveWipManualOverrides(overrides) {\n  try { localStorage.setItem(WIP_MANUAL_OVERRIDES_KEY, JSON.stringify(overrides)); } catch (e) { /* private mode — ignore */ }\n}\n\nfunction loadWipLastUpdated() {\n  try { return localStorage.getItem(WIP_LAST_UPDATED_KEY) || null; } catch (e) { return null; }\n}\n\nfunction saveWipLastUpdated(dateStr) {\n  try { localStorage.setItem(WIP_LAST_UPDATED_KEY, dateStr); } catch (e) { /* private mode — ignore */ }\n}\n\nstate.wipManualOverrides = loadWipManualOverrides();\nstate.wipLastUpdated = loadWipLastUpdated();\n\nfunction wipLog(msg, type = '') {\n  const el = document.getElementById('wip-log');\n  const line = document.createElement('div');\n  line.className = type ? `log-${type}` : '';\n  line.textContent = `[${new Date().toLocaleTimeString('en-US')}] ${msg}`;\n  el.appendChild(line);\n  el.scrollTop = el.scrollHeight;\n}\n\n\n\nfunction findWipHeaderRow(raw) {\n  for (let i = 0; i < Math.min(20, raw.length); i++) {\n    const row = raw[i];\n    if (!row) continue;\n    const dateCol = findColumn(row, LEDGER_DATE_HEADERS);\n    const debitCol = findColumn(row, LEDGER_DEBIT_HEADERS);\n    const creditCol = findColumn(row, LEDGER_CREDIT_HEADERS);\n    const descCol = findColumn(row, LEDGER_DESC_HEADERS);\n    const refCol = findColumn(row, LEDGER_REF_HEADERS);\n    const opIdCol = findColumn(row, WIP_OPID_HEADERS);\n    if (dateCol === -1 || debitCol === -1 || creditCol === -1 || descCol === -1) continue;\n    return { headerRowIdx: i, dateCol, debitCol, creditCol, descCol, refCol, opIdCol };\n  }\n  return null;\n}\n\n// Every dated row with a non-zero debit or credit is a real entry — this\n// naturally includes the \"الرصيد الافتتاحي\" (opening balance) line and\n// excludes the account-header line (no date) and the \"إجمالي العملية\" /\n// \"الرصيد الختامى\" summary lines at the end (explicitly skipped, since —\n// like the supplier ledger — they'd otherwise double-count the total).\nfunction parseWipStatement(raw) {\n  const hdr = findWipHeaderRow(raw);\n  if (!hdr) return null;\n  const { headerRowIdx, dateCol, debitCol, creditCol, descCol, refCol, opIdCol } = hdr;\n\n  const rows = [];\n  for (let i = headerRowIdx + 1; i < raw.length; i++) {\n    const row = raw[i];\n    if (!row || row.every(v => v === null || v === undefined || v === '')) continue;\n\n    const descVal = String(row[descCol] ?? '').trim();\n    if (descVal.includes('الرصيد الختام') || descVal.includes('جمالي العملية')) continue;\n\n    const dateVal = parseLedgerDate(row[dateCol]);\n    const debitVal = parseFloat(String(row[debitCol] ?? '0').replace(/,/g, '')) || 0;\n    const creditVal = parseFloat(String(row[creditCol] ?? '0').replace(/,/g, '')) || 0;\n    if (!dateVal || (debitVal === 0 && creditVal === 0)) continue;\n\n    const refVal = refCol !== -1 ? String(row[refCol] ?? '').trim() : '';\n    const opIdRaw = opIdCol !== -1 ? String(row[opIdCol] ?? '').trim() : '';\n    // A stable per-entry key for persisted manual classification: the\n    // transaction's own operation number when there is one (regular\n    // entries), or a composite of its fields when there isn't (e.g. the\n    // opening-balance line, which has no operation number).\n    const opId = opIdRaw || `composite:${dateVal.toISOString()}|${refVal}|${descVal}|${debitVal}|${creditVal}`;\n\n    rows.push({ date: dateVal, debit: debitVal, credit: creditVal, desc: descVal, ref: refVal, opId });\n  }\n  return rows;\n}\n\n// Manual overrides (a person explicitly assigning a specific entry to a\n// category, persisted by that entry's own opId) always win — they exist\n// precisely to handle entries the automatic pattern rules can't place.\n// Otherwise: -1 = stays in the ongoing 2026 ledger (matches one of the 4\n// confirmed patterns), 0-3 = a settlement category match, -2 = matches\n// neither and needs a person to classify it before the file can be\n// downloaded.\n// The opening balance represents the combined total of the 4 Plan target\n// values themselves (not an actual cost posting against any one of them),\n// so its classification is fixed and permanent — checked before anything\n// else, including manual overrides, and excluded from both the \"2026\n// ongoing\" and \"2025 settlement\" buckets (categoryIndex -3).\nconst WIP_OPENING_BALANCE_PATTERNS = ['الرصيد الافتتاحي', 'الرصيد الأفتتاحي'];\n\nfunction classifyWipRow(desc, opId, ongoingPatterns, categories, manualOverrides) {\n  for (const pattern of WIP_OPENING_BALANCE_PATTERNS) {\n    if (desc.includes(pattern)) return -3;\n  }\n  if (manualOverrides && Object.prototype.hasOwnProperty.call(manualOverrides, opId)) {\n    return manualOverrides[opId];\n  }\n  for (const pattern of ongoingPatterns) {\n    if (pattern && desc.includes(pattern)) return -1;\n  }\n  for (let i = 0; i < categories.length; i++) {\n    const kw = (categories[i].match || '').trim();\n    if (kw && desc.includes(kw)) return i;\n  }\n  return -2;\n}\n\nfunction reclassifyWipRows() {\n  if (!state.wipRows) return;\n  state.wipRows.forEach(r => {\n    r.categoryIndex = classifyWipRow(r.desc, r.opId, state.wipOngoingPatterns, state.wipCategories, state.wipManualOverrides);\n    r.isManual = Object.prototype.hasOwnProperty.call(state.wipManualOverrides, r.opId);\n  });\n  renderWipCategories();\n  renderWipOutside();\n  renderWipResult();\n}\n\nfunction handleWipStatement(input) {\n  const file = input.files[0];\n  if (!file) return;\n  const reader = new FileReader();\n  reader.onload = e => {\n    try {\n      const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });\n      const ws = wb.Sheets[wb.SheetNames[0]];\n      const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });\n      const rows = parseWipStatement(raw);\n\n      document.getElementById('wip-log').innerHTML = '';\n\n      if (!rows || rows.length === 0) {\n        document.getElementById('wip-categories-card').style.display = 'none';\n        document.getElementById('wip-outside-card').style.display = 'none';\n        document.getElementById('wip-result-card').style.display = 'none';\n        wipLog(\"Couldn't find date/description/debit/credit columns in this file — check the format\", 'err');\n        return;\n      }\n\n      state.wipRows = rows;\n      state.wipLastUpdated = new Date().toISOString().split('T')[0];\n      saveWipLastUpdated(state.wipLastUpdated);\n      document.getElementById('fname-wip').textContent = '✓ ' + file.name;\n      document.getElementById('fname-wip').classList.add('show');\n      document.getElementById('zone-wip').classList.add('loaded');\n      document.getElementById('stats-wip').innerHTML = `<div class=\"stat-chip\">Rows: <span>${rows.length}</span></div>`;\n      wipLog(`Loaded ${file.name} — ${rows.length} row(s)`, 'ok');\n\n      document.getElementById('wip-categories-card').style.display = 'block';\n      document.getElementById('wip-ongoing-card').style.display = 'block';\n      renderWipOngoingPatterns();\n      reclassifyWipRows();\n    } catch (err) {\n      document.getElementById('wip-log').innerHTML = '';\n      wipLog(`Error reading file: ${err.message}`, 'err');\n    }\n  };\n  reader.readAsArrayBuffer(file);\n}\n\nfunction onWipOngoingPatternChange(index, value) {\n  state.wipOngoingPatterns[index] = value;\n  saveWipOngoingPatterns(state.wipOngoingPatterns);\n  reclassifyWipRows();\n}\n\nfunction renderWipOngoingPatterns() {\n  const body = document.getElementById('wip-ongoing-body');\n  body.innerHTML = state.wipOngoingPatterns.map((pattern, i) => `\n    <tr>\n      <td>${i + 1}</td>\n      <td><input type=\"text\" class=\"cell-input\" style=\"width:100%\" value=\"${pattern.replace(/\"/g, '&quot;')}\" onchange=\"onWipOngoingPatternChange(${i}, this.value)\"></td>\n    </tr>`).join('');\n}\n\nfunction onWipCategoryFieldChange(index, field, value) {\n  if (field === 'value') {\n    const num = parseFloat(value);\n    state.wipCategories[index].value = (value === '' || isNaN(num)) ? null : num;\n  } else {\n    state.wipCategories[index][field] = value;\n  }\n  saveWipCategories(state.wipCategories);\n  reclassifyWipRows();\n}\n\nfunction renderWipCategories() {\n  const lastUpdatedEl = document.getElementById('wip-last-updated');\n  if (lastUpdatedEl) lastUpdatedEl.textContent = state.wipLastUpdated ? `Last updated: ${state.wipLastUpdated}` : '';\n\n  const openingBalanceNote = document.getElementById('wip-opening-balance-note');\n  if (openingBalanceNote && state.wipRows) {\n    const opening = state.wipRows.filter(r => r.categoryIndex === -3);\n    const openingNet = opening.reduce((s, r) => s + (r.credit - r.debit), 0);\n    openingBalanceNote.textContent = opening.length\n      ? `ℹ️ Opening balance (${Math.abs(openingNet).toLocaleString('en-US', { minimumFractionDigits: 2 })}) is fixed and excluded here — it represents the combined Plan totals themselves, not a posting against any one category.`\n      : '';\n  }\n\n  const body = document.getElementById('wip-categories-body');\n  let totalValue = 0, totalRemaining = 0, anyValue = false;\n  body.innerHTML = state.wipCategories.map((cat, i) => {\n    const posted = state.wipRows\n      ? state.wipRows.filter(r => r.categoryIndex === i).reduce((s, r) => s + (r.credit - r.debit), 0)\n      : 0;\n    const remaining = typeof cat.value === 'number' ? cat.value - posted : null;\n    if (typeof cat.value === 'number') { totalValue += cat.value; anyValue = true; }\n    if (remaining !== null) totalRemaining += remaining;\n    return `\n    <tr>\n      <td><input type=\"text\" class=\"cell-input\" style=\"width:100%;text-align:right\" value=\"${cat.label.replace(/\"/g, '&quot;')}\" onchange=\"onWipCategoryFieldChange(${i},'label',this.value)\"></td>\n      <td><input type=\"text\" class=\"cell-input\" style=\"width:100%\" value=\"${cat.match.replace(/\"/g, '&quot;')}\" onchange=\"onWipCategoryFieldChange(${i},'match',this.value)\"></td>\n      <td><input type=\"number\" class=\"cell-input\" placeholder=\"target value\" value=\"${cat.value !== null ? cat.value : ''}\" onchange=\"onWipCategoryFieldChange(${i},'value',this.value)\"></td>\n      <td>${posted.toLocaleString('en-US', { minimumFractionDigits: 2 })}</td>\n      <td style=\"${remaining !== null && remaining > 0.005 ? 'color:var(--orange);font-weight:700' : ''}\">${remaining !== null ? remaining.toLocaleString('en-US', { minimumFractionDigits: 2 }) : '—'}</td>\n    </tr>`;\n  }).join('');\n\n  document.getElementById('wip-categories-foot').innerHTML = `\n    <tr style=\"font-weight:700; background:var(--bg)\">\n      <td>اجمالي التسويات (Total)</td>\n      <td></td>\n      <td>${anyValue ? totalValue.toLocaleString('en-US', { minimumFractionDigits: 2 }) : '—'}</td>\n      <td></td>\n      <td>${anyValue ? totalRemaining.toLocaleString('en-US', { minimumFractionDigits: 2 }) : '—'}</td>\n    </tr>`;\n}\n\n// \"المواد المستخدمة داخليا\" (materials used internally / AFTER COST /\n// REWORK) is genuinely ambiguous — it's neither a confirmed 2026 pattern\n// nor a clear match for any of the 4 settlement categories — so it's\n// called out with its own highlight and label rather than blending in with\n// other outside-classification rows.\nfunction isQuestionableWipRow(desc) {\n  return desc.includes('المواد المستخدمة داخليا') || desc.includes('AFTER COST') || desc.includes('REWORK');\n}\n\nfunction wipCategoryRemaining(i) {\n  const cat = state.wipCategories[i];\n  if (typeof cat.value !== 'number') return null;\n  const posted = state.wipRows.filter(r => r.categoryIndex === i).reduce((s, r) => s + (r.credit - r.debit), 0);\n  return cat.value - posted;\n}\n\nfunction onWipManualClassify(opId, value) {\n  if (value === '') {\n    delete state.wipManualOverrides[opId];\n  } else {\n    state.wipManualOverrides[opId] = parseInt(value, 10);\n  }\n  saveWipManualOverrides(state.wipManualOverrides);\n  reclassifyWipRows();\n}\n\nfunction escapeForOnchangeAttr(s) {\n  return String(s)\n    .replace(/\\\\/g, '\\\\\\\\')\n    .replace(/'/g, \"\\\\'\")\n    .replace(/\"/g, '&quot;')\n    .replace(/</g, '&lt;')\n    .replace(/>/g, '&gt;');\n}\n\nfunction renderWipOutsideRow(r) {\n  const questionable = isQuestionableWipRow(r.desc);\n  const rowStyle = questionable ? ' style=\"background:var(--yellow)\"' : '';\n  const flag = questionable ? ' <span class=\"tag\" style=\"background:var(--orange);color:#fff;margin-inline-start:6px\">Unclassified</span>' : '';\n  const amount = r.debit > 0 ? r.debit : r.credit;\n\n  const options = state.wipCategories.map((cat, i) => {\n    const remaining = wipCategoryRemaining(i);\n    const remainingTxt = remaining !== null ? remaining.toLocaleString('en-US', { maximumFractionDigits: 2 }) : '—';\n    return `<option value=\"${i}\">${cat.label} — Remaining: ${remainingTxt}</option>`;\n  }).join('');\n\n  return `\n    <tr${rowStyle}>\n      <td>${r.date.toISOString().slice(0, 10)}</td>\n      <td>${r.ref}</td>\n      <td style=\"max-width:360px;white-space:normal\">${r.desc}${flag}</td>\n      <td>${amount.toLocaleString('en-US', { minimumFractionDigits: 2 })}</td>\n      <td>\n        <select class=\"cell-input\" style=\"width:100%\" onchange=\"onWipManualClassify('${escapeForOnchangeAttr(r.opId)}', this.value)\">\n          <option value=\"\">-- Classify (required) --</option>\n          ${options}\n        </select>\n      </td>\n    </tr>`;\n}\n\nfunction renderWipOutside() {\n  if (!state.wipRows) return;\n  const outside = state.wipRows.filter(r => r.categoryIndex === -2).sort((a, b) => a.date - b.date);\n  const debitRows = outside.filter(r => r.debit > 0);\n  const creditRows = outside.filter(r => r.credit > 0);\n\n  document.getElementById('wip-outside-debit-body').innerHTML = debitRows.length\n    ? debitRows.map(renderWipOutsideRow).join('')\n    : `<tr><td colspan=\"5\" style=\"color:var(--muted)\">None</td></tr>`;\n  document.getElementById('wip-outside-credit-body').innerHTML = creditRows.length\n    ? creditRows.map(renderWipOutsideRow).join('')\n    : `<tr><td colspan=\"5\" style=\"color:var(--muted)\">None</td></tr>`;\n\n  // Total 2025 Remaining (from the category summary) minus the net effect\n  // of everything now individually listed here — what's left after you\n  // account for every outside-classification entry by name.\n  const totalRemaining = state.wipCategories.reduce((sum, cat, i) => {\n    if (typeof cat.value !== 'number') return sum;\n    const posted = state.wipRows.filter(r => r.categoryIndex === i).reduce((s, r) => s + (r.credit - r.debit), 0);\n    return sum + (cat.value - posted);\n  }, 0);\n  const outsideNet = outside.reduce((s, r) => s + (r.credit - r.debit), 0);\n  const remainder = totalRemaining - outsideNet;\n  document.getElementById('wip-outside-remaining').textContent = remainder.toLocaleString('en-US', { minimumFractionDigits: 2 });\n\n  document.getElementById('wip-outside-card').style.display = 'block';\n}\n\nfunction renderWipResult() {\n  if (!state.wipRows) return;\n  const count2026 = state.wipRows.filter(r => r.categoryIndex === -1).length;\n  const count2025 = state.wipRows.filter(r => r.categoryIndex >= 0).length;\n  const countUnclassified = state.wipRows.filter(r => r.categoryIndex === -2).length;\n  const totalRemaining = state.wipCategories.reduce((sum, cat, i) => {\n    if (typeof cat.value !== 'number') return sum;\n    const posted = state.wipRows.filter(r => r.categoryIndex === i).reduce((s, r) => s + (r.credit - r.debit), 0);\n    return sum + (cat.value - posted);\n  }, 0);\n\n  document.getElementById('wip-2026-count').textContent = count2026;\n  document.getElementById('wip-2025-count').textContent = count2025;\n  document.getElementById('wip-2025-remaining').textContent = totalRemaining.toLocaleString('en-US', { maximumFractionDigits: 2 });\n  document.getElementById('wip-unclassified-count').textContent = countUnclassified;\n  document.getElementById('wip-result-card').style.display = 'block';\n\n  // Gate: the file can't be downloaded while any entry is still waiting on\n  // a person to classify it — otherwise the exported 2025 summary would be\n  // silently incomplete.\n  const btn = document.getElementById('wip-download-btn');\n  const gateMsg = document.getElementById('wip-gate-message');\n  if (countUnclassified > 0) {\n    btn.disabled = true;\n    gateMsg.style.display = 'block';\n    gateMsg.textContent = `⚠️ Classify ${countUnclassified} entr${countUnclassified === 1 ? 'y' : 'ies'} in \"Entries Outside Classification\" above before downloading.`;\n  } else {\n    btn.disabled = false;\n    gateMsg.style.display = 'none';\n  }\n}\n\nasync function downloadWipSplit() {\n  if (!state.wipRows) return;\n\n  const stillUnclassified = state.wipRows.filter(r => r.categoryIndex === -2).length;\n  if (stillUnclassified > 0) {\n    wipLog(`Can't download — ${stillUnclassified} entr${stillUnclassified === 1 ? 'y' : 'ies'} still need${stillUnclassified === 1 ? 's' : ''} classification in \"Entries Outside Classification\".`, 'err');\n    return;\n  }\n\n  const workbook = new ExcelJS.Workbook();\n\n  // --- Sheet 1: 2026 ongoing ledger ---\n  const ongoing = state.wipRows.filter(r => r.categoryIndex === -1).sort((a, b) => a.date - b.date);\n  const sheet1 = workbook.addWorksheet('2026');\n  sheet1.addRow(['Date', 'Reference', 'Description', 'Debit', 'Credit', 'Running Balance']).font = { bold: true };\n  let running = 0;\n  ongoing.forEach(r => {\n    running += r.credit - r.debit;\n    const row = sheet1.addRow([r.date, r.ref, r.desc, r.debit || null, r.credit || null, running]);\n    row.getCell(1).numFmt = 'yyyy-mm-dd';\n    row.getCell(4).numFmt = row.getCell(5).numFmt = row.getCell(6).numFmt = '#,##0.00';\n  });\n  sheet1.columns = [{ width: 12 }, { width: 14 }, { width: 60 }, { width: 14 }, { width: 14 }, { width: 16 }];\n\n  // --- Sheet 2: ملخص رصيد 2025 — same layout as the reference template ---\n  const sheet2 = workbook.addWorksheet('ملخص رصيد 2025');\n  const headerRow = sheet2.addRow(['الجرد الفعلي وما يجب ان يكون', 'القيمة', 'ما تم تسجيلة', 'الرصيد']);\n  headerRow.font = { bold: true, color: { argb: 'FFFFFFFF' } };\n  headerRow.eachCell(cell => { cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF714B67' } }; });\n\n  let totalValue = 0, totalRemaining = 0;\n  state.wipCategories.forEach((cat, i) => {\n    const posted = state.wipRows.filter(r => r.categoryIndex === i).reduce((s, r) => s + (r.credit - r.debit), 0);\n    const remaining = typeof cat.value === 'number' ? cat.value - posted : null;\n    if (typeof cat.value === 'number') totalValue += cat.value;\n    if (remaining !== null) totalRemaining += remaining;\n    const row = sheet2.addRow([cat.label, cat.value, posted, remaining]);\n    row.getCell(2).numFmt = row.getCell(3).numFmt = row.getCell(4).numFmt = '#,##0.00';\n  });\n  const totalRow = sheet2.addRow(['اجمالي التسويات', totalValue, null, totalRemaining]);\n  totalRow.font = { bold: true };\n  totalRow.getCell(2).numFmt = totalRow.getCell(4).numFmt = '#,##0.00';\n\n  const openingRows = state.wipRows.filter(r => r.categoryIndex === -3);\n  if (openingRows.length) {\n    const openingNet = Math.abs(openingRows.reduce((s, r) => s + (r.credit - r.debit), 0));\n    const noteRow = sheet2.addRow([`ملاحظة: الرصيد الافتتاحي (${openingNet.toLocaleString('en-US', { minimumFractionDigits: 2 })}) ثابت ومستبعد هنا — يمثل إجمالي القيم أعلاه، وليس ترحيل ضد فئة واحدة`]);\n    noteRow.font = { italic: true, size: 9, color: { argb: 'FF726C7A' } };\n  }\n\n  sheet2.addRow([]);\n\n  const outside = state.wipRows.filter(r => r.categoryIndex === -2).sort((a, b) => a.date - b.date);\n  const debitRows = outside.filter(r => r.debit > 0);\n  const creditRows = outside.filter(r => r.credit > 0);\n\n  const addOutsideSection = (title, rows) => {\n    const titleRow = sheet2.addRow([title]);\n    titleRow.font = { bold: true };\n    rows.forEach(r => {\n      const amount = r.debit > 0 ? r.debit : r.credit;\n      const questionable = isQuestionableWipRow(r.desc);\n      const row = sheet2.addRow([`${r.desc}${questionable ? '  [Unclassified]' : ''}`, amount, null, null]);\n      row.getCell(2).numFmt = '#,##0.00';\n      if (questionable) {\n        row.eachCell(cell => { cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFDF3E4' } }; });\n        row.getCell(1).font = { color: { argb: 'FFDB8A2C' }, bold: true };\n      }\n    });\n  };\n  addOutsideSection('قيود برا التصنيف — مدين', debitRows);\n  addOutsideSection('قيود برا التصنيف — دائن', creditRows);\n\n  const outsideNet = outside.reduce((s, r) => s + (r.credit - r.debit), 0);\n  const remainderRow = sheet2.addRow(['المتبقي', null, null, totalRemaining - outsideNet]);\n  remainderRow.font = { bold: true };\n  remainderRow.getCell(4).numFmt = '#,##0.00';\n\n  sheet2.columns = [{ width: 55 }, { width: 16 }, { width: 16 }, { width: 16 }];\n\n  const buffer = await workbook.xlsx.writeBuffer();\n  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url;\n  a.download = `WIP_Split_${new Date().toISOString().split('T')[0]}.xlsx`;\n  document.body.appendChild(a);\n  a.click();\n  document.body.removeChild(a);\n  URL.revokeObjectURL(url);\n\n  wipLog('Downloaded split workbook', 'ok');\n}\n\nasync function processFiles() {\n  try {\n  document.getElementById('log').innerHTML = '';\n  setProgress(0);\n  log('Starting processing...', 'info');\n\n  const tParsed = parseFile('t', state.t.raw);\n  log(`Transfers: ${tParsed.docs} doc(s) — ${tParsed.items} item(s)`, 'ok');\n  setProgress(20);\n\n  let rParsed = { parsed: [], docs: 0, items: 0 };\n  if (state.r) {\n    rParsed = parseFile('r', state.r.raw);\n    log(`Returns: ${rParsed.docs} doc(s) — ${rParsed.items} item(s)`, 'ok');\n  } else {\n    log('No returns file — the returns step will be skipped', 'warn');\n  }\n  setProgress(40);\n\n  let existingItems = [];\n  let existingDocs = new Set();\n  if (state.n) {\n    const nParsed = parseFile('n', state.n.raw);\n    existingItems = nParsed.parsed;\n    existingDocs = new Set(existingItems.map(x => x.doc));\n    log(`Current final file: ${existingDocs.size} doc(s) — ${existingItems.length} item(s)`, 'ok');\n  } else {\n    log('No current final file — a new file will be created', 'info');\n  }\n  setProgress(60);\n\n  // Get return doc numbers\n  const returnDocs = new Set(rParsed.parsed.map(x => x.doc));\n\n  // New transfers not already in النهائي and not in returns\n  const newTransfers = tParsed.parsed.filter(x => !existingDocs.has(x.doc));\n  const newReturns   = rParsed.parsed.filter(x => !existingDocs.has(x.doc));\n\n  log(`New transfers to add: ${new Set(newTransfers.map(x=>x.doc)).size} doc(s) — ${newTransfers.length} item(s)`, 'ok');\n  if (newReturns.length > 0)\n    log(`New returns to add: ${new Set(newReturns.map(x=>x.doc)).size} doc(s) — ${newReturns.length} item(s)`, 'warn');\n  setProgress(80);\n\n  // Merge: existing + new transfers + new returns\n  const allItems = [...existingItems, ...newTransfers, ...newReturns];\n\n  state.result = allItems;\n\n  // Show summary\n  const allDocs = new Set(allItems.map(x => x.doc));\n  const transferDocs = new Set(allItems.filter(x=>x.type==='transfer').map(x=>x.doc));\n  const returnDocsFinal = new Set(allItems.filter(x=>x.type==='return').map(x=>x.doc));\n\n  document.getElementById('r-transfers').textContent = transferDocs.size;\n  document.getElementById('r-returns').textContent = returnDocsFinal.size;\n  document.getElementById('r-total-docs').textContent = allDocs.size;\n  document.getElementById('r-total-rows').textContent = allItems.length;\n\n  // Preview\n  const tbody = document.getElementById('preview-body');\n  tbody.innerHTML = '';\n  allItems.slice(0, 50).forEach(item => {\n    const tr = document.createElement('tr');\n    tr.innerHTML = `\n      <td><span class=\"tag ${item.type==='return'?'tag-r':'tag-t'}\">${item.type==='return'?'Return':'Transfer'}</span></td>\n      <td>${item.doc}</td>\n      <td>${item.ref}</td>\n      <td>${item.code}</td>\n      <td style=\"max-width:200px;overflow:hidden;text-overflow:ellipsis\">${item.desc}</td>\n      <td>${item.qty.toLocaleString('en-US')}</td>\n      <td>${item.unit}</td>\n      <td>${item.price.toLocaleString('en-US',{minimumFractionDigits:4})}</td>\n      <td>${item.amount.toLocaleString('en-US',{minimumFractionDigits:4})}</td>\n    `;\n    tbody.appendChild(tr);\n  });\n\n  setProgress(100);\n  log(`✅ Processing complete — ${allItems.length} row(s) total, ready to download`, 'ok');\n  document.getElementById('result-card').classList.add('show');\n  } catch (err) {\n    log(`❌ An error occurred and processing did not complete: ${err.message}`, 'err');\n    console.error(err);\n  }\n}\n\nfunction summarizeByRef() {\n  const refInput = document.getElementById('ref-search').value.trim();\n  const selectedRefs = state.selectedRefs;\n\n  if (!refInput && selectedRefs.length === 0) {\n    log('Please enter a reference number or pick at least one from the list', 'warn');\n    return;\n  }\n\n  if (!state.t && !state.r && !state.n) {\n    log('Please upload at least one file before searching', 'warn');\n    return;\n  }\n\n  // Gather items from every uploaded file (transfers + returns + final)\n  let allItems = [];\n  ['t', 'r', 'n'].forEach(key => {\n    if (state[key]) {\n      const parsed = parseFile(key, state[key].raw);\n      allItems = allItems.concat(parsed.parsed);\n    }\n  });\n\n  // Match: exact match against any chosen ref chip, OR substring match\n  // against whatever text is still typed (but not yet picked from the list).\n  const matched = allItems.filter(it => {\n    const itRef = String(it.ref || '').trim();\n    if (selectedRefs.length > 0 && selectedRefs.includes(itRef)) return true;\n    if (refInput && itRef.toLowerCase().includes(refInput.toLowerCase())) return true;\n    return false;\n  });\n\n  const labelParts = [...selectedRefs, ...(refInput ? [refInput] : [])];\n  const refLabel = labelParts.join(', ');\n\n  if (matched.length === 0) {\n    document.getElementById('ref-result-card').classList.remove('show');\n    log(`No rows found for reference number: ${refLabel}`, 'warn');\n    return;\n  }\n\n  // First flip the sign of qty/amount for return rows, THEN group by item code\n  // so each item appears once with its net total (transfer − return).\n  const groups = {};\n  matched.forEach(it => {\n    const sign = it.type === 'return' ? -1 : 1;\n    if (!groups[it.code]) {\n      groups[it.code] = { code: it.code, desc: it.desc, unit: it.unit, qty: 0, amount: 0 };\n    }\n    groups[it.code].qty += sign * it.qty;\n    groups[it.code].amount += sign * it.amount;\n  });\n\n  const rows = Object.values(groups);\n  state.refResult = { ref: refLabel, rows };\n\n  document.getElementById('ref-result-title').textContent = `📊 Sales Order Summary — Reference ${refLabel}`;\n\n  const tbody = document.getElementById('ref-result-body');\n  tbody.innerHTML = '';\n  rows.forEach(r => {\n    const tr = document.createElement('tr');\n    tr.innerHTML = `\n      <td>${r.code}</td>\n      <td style=\"max-width:250px;overflow:hidden;text-overflow:ellipsis\">${r.desc}</td>\n      <td>${r.unit}</td>\n      <td style=\"${r.qty < 0 ? 'color:var(--red);font-weight:700' : ''}\">${r.qty.toLocaleString('en-US')}</td>\n      <td style=\"${r.amount < 0 ? 'color:var(--red);font-weight:700' : ''}\">${r.amount.toLocaleString('en-US',{minimumFractionDigits:4})}</td>\n    `;\n    tbody.appendChild(tr);\n  });\n\n  document.getElementById('ref-result-card').classList.add('show');\n  log(`Found ${matched.length} row(s) for reference ${refLabel} — ${rows.length} item(s) after grouping`, 'ok');\n}\n\nfunction downloadRefResult() {\n  if (!state.refResult) return;\n\n  const wb = XLSX.utils.book_new();\n  const headers = ['Item Code', 'Item Description', 'Unit', 'Total Qty', 'Total Amount'];\n  const wsData = [headers, ...state.refResult.rows.map(r => [r.code, r.desc, r.unit, r.qty, r.amount])];\n\n  const ws = XLSX.utils.aoa_to_sheet(wsData);\n  ws['!cols'] = [{wch:14},{wch:40},{wch:12},{wch:16},{wch:16}];\n\n  XLSX.utils.book_append_sheet(wb, ws, 'Sales Order Summary');\n  XLSX.writeFile(wb, `SalesOrder_${state.refResult.ref}.xlsx`);\n  log(`Downloaded sales order summary #${state.refResult.ref}`, 'ok');\n}\n\n// Small HTML-escaping helper for safely injecting item data into the\n// printable page below.\nfunction escapeHtmlForPrint(text) {\n  const div = document.createElement('div');\n  div.textContent = text === null || text === undefined ? '' : String(text);\n  return div.innerHTML;\n}\n\n// Renders the sales-order summary as a real HTML page in a hidden iframe and\n// triggers the browser's print dialog (choose \"Save as PDF\"). Arabic text\n// (item descriptions, units) is written as plain Unicode text with no manual\n// shaping or reversal — the browser's own text engine already handles\n// Arabic joining and right-to-left layout correctly, which is far more\n// reliable than trying to draw shaped glyphs by hand in a PDF library.\nfunction downloadRefResultPDF() {\n  if (!state.refResult) return;\n\n  const rows = state.refResult.rows;\n  const tableRows = rows.map(r => `\n    <tr>\n      <td>${escapeHtmlForPrint(r.code)}</td>\n      <td class=\"desc-cell\">${escapeHtmlForPrint(r.desc)}</td>\n      <td class=\"desc-cell\">${escapeHtmlForPrint(r.unit)}</td>\n      <td class=\"num-cell\">${r.qty.toLocaleString('en-US')}</td>\n    </tr>`).join('');\n\n  const printHtml = `<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>Sales Order Summary — ${escapeHtmlForPrint(state.refResult.ref)}</title>\n<style>\n  * { box-sizing: border-box; }\n  body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; color: #23212B; paddin
