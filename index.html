<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaty Cost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8F9FA; --panel: #FFFFFF; --ink: #212529;
    --walnut: #714B67; --walnut-dark: #5B3A54; --amber: #017E84;
    --border: #E0E0E0; --border-soft: #EEEEEE; --muted: #6C757D;
    --danger: #DC3545; --danger-bg: #FDEDEE; --danger-border: #F5C2C7;
    --ok: #1E7E34; --ok-bg: #EAF6EC; --ok-border: #C3E6CB;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
  .loading-wrap { display:flex; align-items:center; justify-content:center; padding:48px 16px; color: var(--walnut); gap:8px; }

  .header { background: var(--walnut); padding: 20px 24px; }
  .header-inner { display:flex; align-items:center; justify-content:space-between; gap:12px; max-width:1100px; margin:0 auto; flex-wrap:wrap; }
  .header-left { display:flex; align-items:center; gap:12px; }
  .title { font-family:'Cairo',sans-serif; font-weight:800; font-size:22px; color: var(--bg); margin:0; }
  .lang-switch { display:flex; gap:4px; }
  .lang-btn { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.3); color:#F8F9FA; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:12px; font-family:'Tajawal',sans-serif; }
  .lang-btn.active { background:#fff; color:var(--walnut); font-weight:700; }
  .logout-btn { background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.3); color:#F8F9FA; padding:8px 14px; border-radius:8px; cursor:pointer; font-family:'Tajawal',sans-serif; font-size:13px; }
  .whoami { color:#EDE4EA; font-size:13px; }
  .role-badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; background:#EDE4EA; color:var(--walnut-dark); }

  .tabs { display:flex; gap:4px; padding:10px 16px 0; max-width:1100px; margin:0 auto; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .tab-btn { display:flex; align-items:center; gap:6px; padding:10px 16px; background:transparent; border:none; border-bottom:3px solid transparent; color: var(--muted); font-family:inherit; font-size:14px; font-weight:500; cursor:pointer; }
  .tab-btn.active { color: var(--walnut); border-bottom:3px solid var(--amber); font-weight:700; }

  .error-banner { max-width:1100px; margin:16px auto 0; background: var(--danger-bg); color: var(--danger); border:1px solid var(--danger-border); border-radius:8px; padding:10px 14px; font-size:14px; }

  main { max-width:1100px; margin:0 auto; padding:20px 16px 48px; }
  .card { background: var(--panel); border:1px solid var(--border); border-radius:12px; padding:22px; box-shadow:0 1px 3px rgba(74,46,25,0.06); margin-bottom:20px; }
  .card-title { font-family:'Cairo',sans-serif; font-size:17px; font-weight:700; margin:0 0 14px; color: var(--walnut-dark); }

  .grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:14px; }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field-label { font-size:13px; color: var(--muted); font-weight:500; }
  .input, select { font-family:inherit; font-size:14px; padding:10px 12px; border-radius:8px; border:1px solid #CED4DA; background:#fff; color: var(--ink); outline:none; width:100%; }
  .locked-box { padding:10px 12px; border-radius:8px; background:#EDE4EA; color: var(--walnut-dark); font-weight:700; }
  .time-pair { display:flex; align-items:center; gap:6px; }
  .time-pair select { width:auto; flex:1; text-align:center; }
  .time-colon { font-weight:700; color: var(--muted); }

  .preview-box { margin-top:20px; display:flex; align-items:center; justify-content:center; gap:24px; background:#E8F5F5; border:1px dashed var(--amber); border-radius:10px; padding:16px 20px; flex-wrap:wrap; }
  .preview-item { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .preview-label { font-size:12px; color: var(--muted); }
  .preview-value { font-family:'Cairo',sans-serif; font-size:24px; font-weight:800; color: var(--walnut); }
  .preview-divider { width:1px; height:36px; background: var(--border); }

  .submit-btn { margin-top:20px; width:100%; padding:12px 0; border-radius:8px; border:none; background: var(--walnut); color: var(--bg); font-family:'Cairo',sans-serif; font-weight:700; font-size:15px; cursor:pointer; }
  .submit-btn:disabled { opacity:0.6; cursor:default; }

  .log-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .export-btn { display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; border:1px solid var(--amber); background:#fff; color: var(--walnut); font-family:inherit; font-weight:700; font-size:13px; cursor:pointer; }

  table { width:100%; border-collapse:collapse; font-size:13px; min-width:680px; }
  th { text-align:start; background:#EDE4EA; color: var(--walnut-dark); padding:10px; font-weight:700; border-bottom:1px solid var(--border); white-space:nowrap; }
  td { padding:9px 10px; border-bottom:1px solid var(--border-soft); white-space:nowrap; }
  .table-wrap { overflow-x:auto; }
  .delete-btn { border:none; background:transparent; color: var(--danger); cursor:pointer; padding:4px; font-size:14px; }
  .empty-row { text-align:center; padding:24px 0; color: var(--muted); }
  .verify-check { width:18px; height:18px; cursor:pointer; }

  .settings-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:16px; }
  ul.list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .list-item { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; background:#E8F5F5; border-radius:6px; font-size:13px; gap:8px; }
  .list-item-actions { display:flex; gap:6px; flex-shrink:0; }
  .small-delete { border:none; background:transparent; color: var(--danger); cursor:pointer; }
  .small-edit { border:none; background:transparent; color: var(--walnut); cursor:pointer; }
  .add-row { display:flex; gap:8px; }
  .add-btn { display:flex; align-items:center; justify-content:center; padding:0 14px; border-radius:8px; border:none; background: var(--walnut); color: var(--bg); cursor:pointer; font-family:inherit; font-weight:700; font-size:13px; }
  .footer { text-align:center; font-size:12px; color: var(--muted); padding:0 16px 24px; }

  .setup-card { max-width:640px; margin:48px auto; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:28px; }
  .setup-card h2 { font-family:'Cairo',sans-serif; color:var(--walnut-dark); margin-top:0; }
  .setup-card code { background:#EDE4EA; padding:2px 6px; border-radius:4px; font-size:13px; }

  .auth-wrap { max-width:380px; margin:70px auto; padding:0 16px; }
  .auth-card { background: var(--panel); border:1px solid var(--border); border-radius:14px; padding:28px; box-shadow:0 2px 8px rgba(74,46,25,0.08); text-align:center; }
  .auth-title { font-family:'Cairo',sans-serif; font-size:20px; font-weight:800; color: var(--walnut-dark); margin:0 0 4px; }

  .gaty-module-tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:var(--panel);border:1px solid var(--border);border-radius:12px;margin:12px auto;max-width:1200px;white-space:nowrap}
  .gaty-module-tabs button{border:1px solid var(--border);background:transparent;color:var(--ink);border-radius:8px;padding:10px 16px;font:inherit;font-size:14px;cursor:pointer}
  .gaty-module-tabs button.active{background:var(--walnut);border-color:var(--walnut);color:#fff}
  .gaty-module-frame{display:block;width:100%;height:calc(100vh - 230px);min-height:600px;border:0;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
</style>

    display: flex;\n    gap: 8px;\n    margin-bottom: 16px;\n  }\n  .main-tab-btn {\n    background: var(--surface);\n    border: 1px solid var(--border);\n    padding: 12px 22px;\n    font-family: inherit;\n    font-size: 14px;\n    font-weight: 700;\n    color: var(--muted);\n    cursor: pointer;\n    border-radius: 10px;\n    transition: color .15s, background .15s, border-color .15s;\n  }\n  .main-tab-btn:hover { color: var(--text); border-color: var(--primary); }\n  .main-tab-btn.active {\n    color: #fff;\n    background: var(--primary);\n    border-color: var(--primary);\n    box-shadow: 0 2px 8px rgba(113,75,103,0.35);\n  }\n  .main-tab-page { display: block; }\n\n  .lock-overlay {\n    position: fixed;\n    inset: 0;\n    background: linear-gradient(135deg, var(--primary), var(--primary-dark));\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    z-index: 9999;\n    padding: 20px;\n  }\n  .lock-box {\n    background: var(--surface);\n    border-radius: var(--radius);\n    padding: 32px 28px;\n    width: 100%;\n    max-width: 340px;\n    box-shadow: 0 8px 30px rgba(35,33,43,0.3);\n    text-align: center;\n  }\n  .lock-box .lock-icon { font-size: 32px; margin-bottom: 10px; }\n  .lock-box h2 { font-size: 16px; color: var(--primary); margin-bottom: 6px; }\n  .lock-box p { font-size: 12px; color: var(--muted); margin-bottom: 18px; }\n  .lock-box input {\n    width: 100%;\n    padding: 12px;\n    border: 1px solid var(--border);\n    border-radius: var(--radius);\n    font-family: inherit;\n    font-size: 14px;\n    margin-bottom: 10px;\n    text-align: center;\n    background: var(--bg);\n    color: var(--text);\n  }\n  .lock-box .lock-err {\n    color: var(--red);\n    font-size: 12px;\n    margin-top: 4px;\n    min-height: 16px;\n    display: none;\n  }\n  .lock-box .lock-err.show { display: block; }\n\n  .app-footer {\n    text-align: center;\n    padding: 32px 0 12px;\n  }\n  .app-footer .by-line {\n    font-size: 11px;\n    color: var(--muted);\n    margin-bottom: 2px;\n  }\n  .app-footer .signature {\n    font-family: Georgia, 'Times New Roman', serif;\n    font-style: italic;\n    font-weight: 600;\n    font-size: 17px;\n    letter-spacing: 0.3px;\n    color: var(--primary);\n  }\n</style>\n<style>#maintabbtn-workshop,#maintab-workshop{display:none!important}</style>\n</head>\n<body>\n\n<div id=\"app-content\" style=\"display:block\">\n\n<div class=\"header\">\n  <div>\n    <h1 id=\"app-title\">Inventory Cost</h1>\n    <p id=\"app-subtitle\">Merge transfer and return files and auto-generate the final file</p>\n  </div>\n  <div class=\"header-right\">\n    <div class=\"badge\">Gaty Furniture</div>\n    <div class=\"signature-badge\" title=\"Designed &amp; built by Reda Alshrkawy\">R</div>\n  </div>\n</div>\n\n<div class=\"main-tab-nav\">\n  <button class=\"main-tab-btn active\" id=\"maintabbtn-cost\" onclick=\"switchMainTab('cost')\">💰 Cost</button>\n  <button class=\"main-tab-btn\" id=\"maintabbtn-workshop\" onclick=\"switchMainTab('workshop')\">🕒 Labor Cost</button>\n</div>\n\n<div id=\"maintab-cost\" class=\"main-tab-page\">\n\n<div class=\"tab-nav\">\n  <button class=\"tab-btn active\" id=\"tabbtn-transfer\" onclick=\"switchTab('transfer')\">📦 Inventory Transfer</button>\n  <button class=\"tab-btn\" id=\"tabbtn-reconcile\" onclick=\"switchTab('reconcile')\">⚖️ Reconcile Two Sheets</button>\n  <button class=\"tab-btn\" id=\"tabbtn-namematch\" onclick=\"switchTab('namematch')\">🔄 Match Tool Sheet vs Final</button>\n  <button class=\"tab-btn\" id=\"tabbtn-uncosted\" onclick=\"switchTab('uncosted')\">📋 Uncosted Orders</button>\n</div>\n\n<div id=\"tab-transfer\" class=\"tab-page\">\n\n<div class=\"grid-2\">\n  <!-- Upload Transfers -->\n  <div class=\"card\">\n    <div class=\"card-title\">\n      <span class=\"dot dot-blue\"></span>\n      Transfers File\n    </div>\n    <div class=\"upload-zone\" id=\"zone-t\">\n      <input type=\"file\" id=\"file-t\" accept=\".xlsx,.xls\" onchange=\"handleFile('t', this)\">\n      <div class=\"upload-icon\">📦</div>\n      <div class=\"upload-label\"><strong>Drag & drop</strong> or click to choose<br>Inventory transfer list</div>\n      <div class=\"file-name\" id=\"fname-t\"></div>\n    </div>\n    <div class=\"stats-row\" id=\"stats-t\"></div>\n  </div>\n\n  <!-- Upload Returns -->\n  <div class=\"card\">\n    <div class=\"card-title\">\n      <span class=\"dot dot-red\"></span>\n      Returns File\n    </div>\n    <div class=\"upload-zone\" id=\"zone-r\">\n      <input type=\"file\" id=\"file-r\" accept=\".xlsx,.xls\" onchange=\"handleFile('r', this)\">\n      <div class=\"upload-icon\">↩️</div>\n      <div class=\"upload-label\"><strong>Drag & drop</strong> or click to choose<br>Returns list (optional)</div>\n      <div class=\"file-name\" id=\"fname-r\"></div>\n    </div>\n    <div class=\"stats-row\" id=\"stats-r\"></div>\n  </div>\n</div>\n\n<!-- Upload Current Final -->\n<div class=\"card\" style=\"margin-bottom:16px\">\n  <div class=\"card-title\">\n    <span class=\"dot dot-green\"></span>\n    Current Final File (optional — to append to)\n  </div>\n  <div class=\"upload-zone\" id=\"zone-n\">\n    <input type=\"file\" id=\"file-n\" accept=\".xlsx,.xls\" onchange=\"handleFile('n', this)\">\n    <div class=\"upload-icon\">📋</div>\n    <div class=\"upload-label\"><strong>Drag & drop</strong> or click to choose<br>Leave empty to create a brand-new file</div>\n    <div class=\"file-name\" id=\"fname-n\"></div>\n  </div>\n  <div class=\"stats-row\" id=\"stats-n\"></div>\n</div>\n\n<!-- Search by ref / sales order number -->\n<div class=\"card\" style=\"margin-bottom:16px\">\n  <div class=\"card-title\">\n    <span class=\"dot dot-blue\"></span>\n    Search a Sales Order by Reference Number\n  </div>\n  <div id=\"ref-selected-chips\" style=\"display:none; flex-wrap:wrap; gap:6px; margin-bottom:10px;\"></div>\n  <div style=\"display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap;\">\n    <div id=\"ref-search-wrap\" style=\"position:relative; flex:1; min-width:200px;\">\n      <input type=\"text\" id=\"ref-search\" autocomplete=\"off\" placeholder=\"Enter reference / sales order number (e.g. 6-2)\" oninput=\"onRefSearchInput()\" onfocus=\"onRefSearchInput()\" style=\"width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:var(--radius); font-family:inherit; font-size:14px; background:var(--bg); color:var(--text);\">\n      <div class=\"ref-suggestions\" id=\"ref-suggestions\"></div>\n    </div>\n    <button class=\"btn btn-primary\" style=\"width:auto; padding:11px 22px;\" onclick=\"summarizeByRef()\">🔍 Search</button>\n  </div>\n  <p style=\"font-size:11px;color:var(--muted)\">Type part of a reference number (e.g. 6-2) and a list of every matching number from the uploaded files will appear — pick one or more (e.g. QUTO 0006-2 and Q 0006-2 together) then click Search. The search covers every uploaded file (transfers + returns + final, if provided), and groups each item into a single row with the total quantity and amount — returns are automatically subtracted (negative qty/amount) before grouping.</p>\n</div>\n\n<!-- Ref search result -->\n<div class=\"result-card\" id=\"ref-result-card\">\n  <div class=\"result-title\" id=\"ref-result-title\">📊 Sales Order Summary</div>\n  <div class=\"preview-table-wrap\">\n    <table>\n      <thead>\n        <tr>\n          <th>Item Code</th>\n          <th>Item Description</th>\n          <th>Unit</th>\n          <th>Total Qty</th>\n          <th>Total Amount</th>\n        </tr>\n      </thead>\n      <tbody id=\"ref-result-body\"></tbody>\n    </table>\n  </div>\n  <div class=\"btn-row\">\n    <button class=\"btn btn-success\" onclick=\"downloadRefResult()\">⬇️ Download Excel (.xlsx)</button>\n    <button class=\"btn btn-outline\" onclick=\"downloadRefResultPDF()\">🖨️ Print / Save as PDF</button>\n  </div>\n</div>\n\n<!-- Process -->\n<div class=\"card\" style=\"margin-bottom:16px\">\n  <div class=\"card-title\">⚙️ Process Data</div>\n  <button class=\"btn btn-primary\" id=\"btn-process\" onclick=\"processFiles()\" disabled>\n    Merge Files & Generate Final\n  </button>\n  <div class=\"progress-bar\" id=\"progress-bar\"><div class=\"progress-fill\" id=\"progress-fill\"></div></div>\n  <div class=\"log-box\" id=\"log\">Waiting for files...</div>\n</div>\n\n<!-- Result -->\n<div class=\"result-card\" id=\"result-card\">\n  <div class=\"result-title\">✅ Final file generated successfully</div>\n  <div class=\"summary-grid\">\n    <div class=\"summary-box\"><div class=\"num\" id=\"r-transfers\">0</div><div class=\"lbl\">New Transfers</div></div>\n    <div class=\"summary-box\"><div class=\"num\" id=\"r-returns\">0</div><div class=\"lbl\">Returns</div></div>\n    <div class=\"summary-box\"><div class=\"num\" id=\"r-total-docs\">0</div><div class=\"lbl\">Total Documents</div></div>\n    <div class=\"summary-box\"><div class=\"num\" id=\"r-total-rows\">0</div><div class=\"lbl\">Total Rows</div></div>\n  </div>\n\n  <div class=\"preview-table-wrap\">\n    <table id=\"preview-table\">\n      <thead>\n        <tr>\n          <th>Type</th>\n          <th>Doc No.</th>\n          <th>Ref No.</th>\n          <th>Item Code</th>\n          <th>Description</th>\n          <th>Qty</th>\n          <th>Unit</th>\n          <th>Price</th>\n          <th>Amount</th>\n        </tr>\n      </thead>\n      <tbody id=\"preview-body\"></tbody>\n    </table>\n  </div>\n  <p style=\"font-size:11px;color:var(--muted);margin-bottom:12px\">Showing the first 50 rows for preview only</p>\n  <button class=\"btn btn-success\" onclick=\"downloadResult()\">⬇️ Download Final File (.xlsx)</button>\n</div>\n\n</div>\n<!-- /tab-transfer -->\n\n<div id=\"tab-reconcile\" class=\"tab-page\" style=\"display:none\">\n\n  <div class=\"grid-2\">\n    <!-- Upload External Sheet -->\n    <div class=\"card\">\n      <div class=\"card-title\">\n        <span class=\"dot dot-blue\"></span>\n        External Sheet\n      </div>\n      <div class=\"upload-zone\" id=\"zone-ext\">\n        <input type=\"file\" id=\"file-ext\" accept=\".xlsx,.xls\" onchange=\"handleExternalSheet(this)\">\n        <div class=\"upload-icon\">📄</div>\n        <div class=\"upload-label\"><strong>Drag & drop</strong> or click to choose<br>Any sheet with an item-code column and a quantity column</div>\n        <div class=\"file-name\" id=\"fname-ext\"></div>\n      </div>\n      <div class=\"stats-row\" id=\"stats-ext\"></div>\n    </div>\n\n    <!-- Upload Tool Output -->\n    <div class=\"card\">\n      <div class=\"card-title\">\n        <span class=\"dot dot-red\"></span>\n        Tool Output\n      </div>\n      <div class=\"upload-zone\" id=\"zone-toolout\">\n        <input type=\"file\" id=\"file-toolout\" accept=\".xlsx,.xls\" onchange=\"handleToolOutputSheet(this)\">\n        <div class=\"upload-icon\">📄</div>\n        <div class=\"upload-label\"><strong>Drag & drop</strong> or click to choose<br>The final file you downloaded from the \"Inventory Transfer\" tab</div>\n        <div class=\"file-name\" id=\"fname-toolout\"></div>\n      </div>\n      <div class=\"stats-row\" id=\"stats-toolout\"></div>\n    </div>\n  </div>\n\n  <div class=\"card\" style=\"margin-bottom:16px\">\n    <div class=\"card-title\">⚖️ Run Reconciliation</div>\n    <button class=\"btn btn-primary\" id=\"btn-reconcile\" onclick=\"runReconciliation()\">\n      Compare by Item Code & Quantity\n    </button>\n    <div class=\"log-box\" id=\"reconcile-log\">Waiting for both files...</div>\n    <p style=\"font-size:11px;color:var(--muted);margin-top:10px\">\n      Matching is based on item code and quantity only. Returns (movement type MATERIALS REFUND) in the tool-output file are automatically converted to negative before matching.\n    </p>\n  </div>\n\n  <div class=\"result-card\" id=\"reconcile-result-card\">\n    <div class=\"result-title\" id=\"reconcile-result-title\">✅ Reconciliation Result</div>\n    <div class=\"summary-grid\">\n      <div class=\"summary-box\"><div class=\"num\" id=\"rec-matched\">0</div><div class=\"lbl\">Matched</div></div>\n      <div class=\"summary-box\"><div class=\"num\" id=\"rec-diff\">0</div><div class=\"lbl\">Mismatched</div></div>\n      <div class=\"summary-box\"><div class=\"num\" id=\"rec-only1\">0</div><div class=\"lbl\">Tool Output Only</div></div>\n      <div class=\"summary-box\"><div class=\"num\" id=\"rec-only2\">0</div><div class=\"lbl\">External Sheet Only</div></div>\n    </div>\n\n    <div class=\"preview-table-wrap\">\n      <table>\n        <thead>\n          <tr>\n            <th>Item Code</th>\n            <th>Description</th>\n            <th>Qty — Tool Output</th>\n            <th>Qty — External Sheet</th>\n            <th>Difference</th>\n            <th>Status</th>\n          </tr>\n        </thead>\n        <tbody id=\"reconcile-body\"></tbody>\n      </table>\n    </div>\n    <button class=\"btn btn-success\" onclick=\"downloadReconcileResult()\">⬇️ Download Reconciliation File (.xlsx)</button>\n  </div>\n\n</div>\n<!-- /tab-reconcile -->\n\n<div id=\"tab-namematch\" class=\"tab-page\" style=\"display:none\">\n\n  <div class=\"grid-2\">\n    <!-- Upload Tool Sheet -->\n    <div class=\"card\">\n      <div class=\"card-title\">\n        <span class=\"dot dot-blue\"></span>\n        Tool Sheet\n      </div>\n      <div class=\"upload-zone\" id=\"zone-toolname\">\n        <input type=\"file\" id=\"file-toolname\" accept=\".xlsx,.xls\" onchange=\"handleToolNameSheet(this)\">\n        <div class=\"upload-icon\">📄</div>\n        <div class=\"upload-label\"><strong>Drag & drop</strong> or click to choose<br>The final file you downloaded from the \"Inventory Transfer\" tab</div>\n        <div class=\"file-name\" id=\"fname-toolname\"></div>\n      </div>\n      <div class=\"stats-row\" id=\"stats-toolname\"></div>\n    </div>\n\n    <!-- Upload Final Sheet -->\n    <div class=\"card\">\n      <div class=\"card-title\">\n        <span class=\"dot dot-red\"></span>\n        Final Sheet\n      </div>\n      <div class=\"upload-zone\" id=\"zone-finalsheet\">\n        <input type=\"file\" id=\"file-finalsheet\" accept=\".xlsx,.xls\" onchange=\"handleFinalSheet(this)\">\n        <div class=\"upload-icon\">📄</div>\n        <div class=\"upload-label\"><strong>Drag & drop</strong> or click to choose<br>The final sheet (the first 5 and last 5 data rows are excluded automatically)</div>\n        <div class=\"file-name\" id=\"fname-finalsheet\"></div>\n      </div>\n      <div class=\"stats-row\" id=\"stats-finalsheet\"></div>\n    </div>\n  </div>\n\n  <div class=\"card\" style=\"margin-bottom:16px\">\n    <div class=\"card-title\">🔄 Run Matching</div>\n    <button class=\"btn btn-primary\" id=\"btn-namematch\" onclick=\"runNameMatch()\">\n      Compare by Item Name & Quantity\n    </button>\n    <div class=\"log-box\" id=\"namematch-log\">Waiting for both files...</div>\n    <p style=\"font-size:11px;color:var(--muted);margin-top:10px\">\n      Matching here is based on <strong>item name and quantity</strong> (not the code). The first 5 and last 5 data rows are excluded from the \"Final Sheet\" before matching. Returns (movement type MATERIALS REFUND) in the tool sheet are automatically converted to negative.\n    </p>\n  </div>\n\n  <div class=\"result-card\" id=\"namematch-result-card\">\n    <div class=\"result-title\" id=\"namematch-result-title\">✅ Matching Result</div>\n    <div class=\"summary-grid\">\n      <div class=\"summary-box\"><div class=\"num\" id=\"nm-matched\">0</div><div class=\"lbl\">Matched</div></div>\n      <div class=\"summary-box\"><div class=\"num\" id=\"nm-diff\">0</div><div class=\"lbl\">Mismatched</div></div>\n      <div class=\"summary-box\"><div class=\"num\" id=\"nm-only1\">0</div><div class=\"lbl\">Tool Sheet Only</div></div>\n      <div class=\"summary-box\"><div class=\"num\" id=\"nm-only2\">0</div><div class=\"lbl\">Final Sheet Only</div></div>\n    </div>\n\n    <div class=\"preview-table-wrap\">\n      <table>\n        <thead>\n          <tr>\n            <th>Item Name</th>\n            <th>Qty — Tool Sheet</th>\n            <th>Qty — Final Sheet</th>\n            <th>Difference</th>\n            <th>Status</th>\n          </tr>\n        </thead>\n        <tbody id=\"namematch-body\"></tbody>\n      </table>\n    </div>\n    <button class=\"btn btn-success\" onclick=\"downloadNameMatchResult()\">⬇️ Download Matching File (.xlsx)</button>\n  </div>\n\n</div>\n<!-- /tab-namematch -->\n\n<div id=\"tab-uncosted\" class=\"tab-page\" style=\"display:none\">\n\n  <div class=\"grid-2\">\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"dot dot-blue\"></span>Final Sheet (الشيت النهائي)</div>\n      <div class=\"upload-zone\" id=\"zone-uc-final\">\n        <input type=\"file\" id=\"file-uc-final\" accept=\".xlsx,.xls\" onchange=\"handleUncostedFile('final', this)\">\n        <div class=\"upload-icon\">📄</div>\n        <div class=\"upload-label\"><strong>Drag & drop</strong> or click to choose<br>The downloaded \"النهائي\" file — reads the رقم المرجع column</div>\n        <div class=\"file-name\" id=\"fname-uc-final\"></div>\n      </div>\n      <div class=\"stats-row\" id=\"stats-uc-final\"></div>\n    </div>\n\n    <div class=\"card\">\n      <div class=\"card-title\"><span class=\"dot dot-red\"></span>Finished Cost Sheet (شيت التكلفة التامة)</div>\n      <div class=\"upload-zone\" id=\"zone-uc-cost\">\n        <input type=\"file\" id=\"file-uc-cost\" accept=\".xlsx,.xls\" onchange=\"handleUncostedFile('cost', this)\">\n        <div class=\"upload-icon\">📄</div>\n        <div class=\"upload-label\"><strong>Drag & drop</strong> or click to choose<br>Reads the sales order / showroom number column</div>\n        <div class=\"file-name\" id=\"fname-uc-cost\"></div>\n      </div>\n      <div class=\"stats-row\" id=\"stats-uc-cost\"></div>\n    </div>\n  </div>\n\n  <div class=\"card\" style=\"margin-bottom:16px\">\n    <div class=\"card-title\"><span class=\"dot dot-green\"></span>Order Status Workbook (شيت حالة الطلب)</div>\n    <div class=\"upload-zone\" id=\"zone-uc-status\">\n      <input type=\"file\" id=\"file-uc-status\" accept=\".xlsx,.xls\" onchange=\"handleUncostedFile('status', this)\">\n      <div class=\"upload-icon\">📄</div>\n      <div class=\"upload-label\"><strong>Drag & drop</strong> or click to choose<br>Any workbook with sheets containing Work Order, Delivery date, Packing, Payment Mode, Email Date, Delivery Status — every matching sheet is scanned</div>\n      <div class=\"file-name\" id=\"fname-uc-status\"></div>\n    </div>\n    <div class=\"stats-row\" id=\"stats-uc-status\"></div>\n    <div class=\"log-box\" id=\"uncosted-log\" style=\"margin-top:12px\">Waiting for all 3 files...</div>\n  </div>\n\n  <div class=\"card\" id=\"uncosted-result-card\" style=\"margin-bottom:16px; display:none\">\n    <div class=\"card-title\">📊 Classification Result</div>\n    <div class=\"summary-grid\">\n      <div class=\"summary-box\"><div class=\"num\" id=\"uc-count-costed\">0</div><div class=\"lbl\">Has Finished Cost</div></div>\n      <div class=\"summary-box\"><div class=\"num\" id=\"uc-count-delivered\">0</div><div class=\"lbl\">Delivered, No Email</div></div>\n      <div class=\"summary-box\"><div class=\"num\" id=\"uc-count-other\">0</div><div class=\"lbl\">Other Statuses</div></div>\n      <div class=\"summary-box\"><div class=\"num\" id=\"uc-count-notfound\">0</div><div class=\"lbl\">Not Found Anywhere</div></div>\n    </div>\n    <div class=\"btn-row\">\n      <button class=\"btn btn-success\" id=\"uc-btn-costed\" onclick=\"downloadUncostedCategory('costed')\" disabled>⬇️ Finished Cost (بالتصنيع)</button>\n      <button class=\"btn btn-success\" id=\"uc-btn-delivered\" onclick=\"downloadUncostedCategory('delivered')\" disabled>⬇️ Delivery Without Email</button>\n    </div>\n    <div class=\"btn-row\">\n      <button class=\"btn btn-outline\" id=\"uc-btn-other\" onclick=\"downloadUncostedCategory('other')\" disabled>⬇️ Other Statuses</button>\n      <button class=\"btn btn-outline\" id=\"uc-btn-notfound\" onclick=\"downloadUncostedCategory('notfound')\" disabled>⬇️ Not Found Anywhere</button>\n    </div>\n  </div>\n\n</div>\n<!-- /tab-uncosted -->\n\n</div>\n<!-- /maintab-cost -->\n\n\n\n<div id=\"maintab-workshop\" class=\"main-tab-page\" style=\"display:none\">\n  <div class=\"card\" style=\"margin-bottom:12px;\">\n    <div class=\"card-title\" style=\"margin-bottom:8px;\">\n      <span class=\"dot dot-blue\"></span>\n      🕒 Labor Cost Tracking\n    </div>\n    <div style=\"display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;\">\n      <p style=\"font-size:12px; color:var(--muted); max-width:640px;\">\n        Tracks day-to-day workshop labor costs (<strong>دفتر الورشة</strong>) — hours, workers, and jobs. Loaded live from the web, so it needs an internet connection, unlike the rest of this app.\n      </p>\n      <a href=\"https://redaabdelkaderabdellatif-sketch.github.io/Labor_Tool/\" target=\"_blank\" rel=\"noopener\" class=\"btn-outline\" style=\"display:inline-block; width:auto; padding:8px 16px; border-radius:8px; font-size:12px; font-weight:700; text-decoration:none; white-space:nowrap;\">↗ Open in Browser</a>\n    </div>\n  </div>\n  <div class=\"card\" style=\"padding:0; overflow:hidden;\">\n    <iframe id=\"workshop-iframe\" src=\"https://redaabdelkaderabdellatif-sketch.github.io/Labor_Tool/\" style=\"width:100%; height:75vh; border:none; display:block; background:var(--surface);\" title=\"Labor Cost — دفتر الورشة\"></iframe>\n  </div>\n</div>\n<!-- /maintab-workshop -->\n\n\n\n<div class=\"app-footer\">\n  <div class=\"by-line\">Crafted for Gaty Furniture by</div>\n  <div class=\"signature\">Reda Alshrkawy</div>\n</div>\n\n</div>\n\n<script>\nfunction switchTab(name) {\n  document.getElementById('tab-transfer').style.display = name === 'transfer' ? 'block' : 'none';\n  document.getElementById('tab-reconcile').style.display = name === 'reconcile' ? 'block' : 'none';\n  document.getElementById('tab-namematch').style.display = name === 'namematch' ? 'block' : 'none';\n  document.getElementById('tab-uncosted').style.display = name === 'uncosted' ? 'block' : 'none';\n  document.getElementById('tabbtn-transfer').classList.toggle('active', name === 'transfer');\n  document.getElementById('tabbtn-reconcile').classList.toggle('active', name === 'reconcile');\n  document.getElementById('tabbtn-namematch').classList.toggle('active', name === 'namematch');\n  document.getElementById('tabbtn-uncosted').classList.toggle('active', name === 'uncosted');\n}\n\nconst MAIN_TAB_INFO = {\n  cost: { title: 'Cost', subtitle: 'Merge transfer and return files and auto-generate the final file' },  workshop: { title: 'Labor Cost', subtitle: 'Workshop labor cost tracking (دفتر الورشة) — loaded live from the web' },};\n\nfunction switchMainTab(name) {\n  document.getElementById('maintab-cost').style.display = name === 'cost' ? 'block' : 'none';\n  document.getElementById('maintab-workshop').style.display = name === 'workshop' ? 'block' : 'none';\n  document.getElementById('maintabbtn-cost').classList.toggle('active', name === 'cost');\n  document.getElementById('maintabbtn-workshop').classList.toggle('active', name === 'workshop');\n  document.getElementById('app-title').textContent = MAIN_TAB_INFO[name].title;\n  document.getElementById('app-subtitle').textContent = MAIN_TAB_INFO[name].subtitle;\n}\n\n// The credential check is done against a list stored in a private GitHub\n// Gist, not values baked into this file. This means credentials can be\n// changed at any time from any browser (just edit the Gist) without ever\n// touching or redistributing this app — every copy checks the same Gist on\n// login. It does mean an internet connection is required at login time\n// only; nothing else in the app depends on the network.\n//\n// Gist format (each entry maps one code to one access level):\n// { \"users\": [\n//     { \"passwordHash\": \"...\", \"access\": \"cost\" },\n//     { \"passwordHash\": \"...\", \"access\": \"full\" }\n// ] }\n// \"access\" is \"full\" (every tab) or \"cost\" (Cost tab only). Older Gists\n// with just {\"passwordHash\": \"...\"} still work and grant full access.\nconst LOCK_HASH_URL = 'https://gist.githubusercontent.com/redaabdelkaderabdellatif-sketch/948e642e38bd9833399c1e2469300b58/raw/gaty-lock.json';\n\nasync function fetchRemoteUsers() {\n  const res = await fetch(LOCK_HASH_URL, { cache: 'no-store' });\n  if (!res.ok) throw new Error('HTTP ' + res.status);\n  const data = await res.json();\n  if (data && Array.isArray(data.users)) return data.users;\n  if (data && typeof data.passwordHash === 'string') return [{ passwordHash: data.passwordHash, access: 'full' }];\n  throw new Error('Malformed lock file');\n}\n\n// Hides everything but the Cost tab and locks the app onto it, for a\n// \"cost\"-level login. Full-access logins leave the normal tab set alone.\nfunction applyAccessRestrictions() {\n  if (state.accessLevel === 'full') return;\n  ['maintabbtn-workshop'].forEach(id => {\n    const btn = document.getElementById(id);\n    if (btn) btn.style.display = 'none';\n  });\n  switchMainTab('cost');\n}\n\nasync function checkPassword() {\n  const input = document.getElementById('lock-password');\n  const err = document.getElementById('lock-err');\n  const btn = document.getElementById('lock-login-btn');\n\n  err.classList.remove('show');\n  if (btn) { btn.disabled = true; btn.textContent = 'Checking...'; }\n\n  try {\n    const users = await fetchRemoteUsers();\n    const hash = sha256Hex(input.value);\n    const match = users.find(u => u.passwordHash === hash);\n    if (match) {\n      state.accessLevel = match.access === 'cost' ? 'cost' : 'full';\n      document.getElementById('lock-overlay').style.display = 'none';\n      document.getElementById('app-content').style.display = 'block';\n      applyAccessRestrictions();\n      return;\n    }\n    err.textContent = 'Incorrect password';\n    err.classList.add('show');\n    input.value = '';\n    input.focus();\n  } catch (e) {\n    err.textContent = 'Could not verify password — check your internet connection';\n    err.classList.add('show');\n  } finally {\n    if (btn) { btn.disabled = false; btn.textContent = 'Login'; }\n  }\n}\n\nconst state = { t: null, r: null, n: null, result: null, allRefs: [], selectedRefs: [], accessLevel: 'full' };\nconst WIP_OPID_HEADERS = ['رقم العملية', 'operation no', 'transaction no'];\nconst WIP_ONGOING_KEY = 'gati_wip_ongoing_patterns_v1';\nconst WIP_ONGOING_DEFAULTS = ['', '', '', ''];\nconst WIP_CATEGORIES_KEY = 'gati_wip_categories_v1';\nconst WIP_CATEGORY_DEFAULTS = [\n  { label: 'فئة تسوية 1', match: '', value: null },\n  { label: 'فئة تسوية 2', match: '', value: null },\n  { label: 'فئة تسوية 3', match: '', value: null },\n  { label: 'فئة تسوية 4', match: '', value: null }\n];\n\nfunction log(msg, type='') {\n  const el = document.getElementById('log');\n  const line = document.createElement('div');\n  line.className = type ? `log-${type}` : '';\n  line.textContent = `[${new Date().toLocaleTimeString('en-US')}] ${msg}`;\n  el.appendChild(line);\n  el.scrollTop = el.scrollHeight;\n}\n\nfunction setProgress(pct) {\n  document.getElementById('progress-fill').style.width = pct + '%';\n}\n\nfunction handleFile(key, input) {\n  const file = input.files[0];\n  if (!file) return;\n  const reader = new FileReader();\n  reader.onload = e => {\n    try {\n      const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });\n      const ws = wb.Sheets[wb.SheetNames[0]];\n      const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });\n      state[key] = { raw, file, wb };\n\n      document.getElementById(`fname-${key}`).textContent = '✓ ' + file.name;\n      document.getElementById(`fname-${key}`).classList.add('show');\n      document.getElementById(`zone-${key}`).classList.add('loaded');\n\n      // Parse and show stats\n      const parsed = parseFile(key, raw);\n      showStats(key, parsed);\n      log(`Loaded ${file.name} — ${parsed.docs} doc(s), ${parsed.items} item(s)`, 'ok');\n      checkReady();\n      rebuildRefIndex();\n    } catch(err) {\n      log(`Error reading file: ${err.message}`, 'err');\n    }\n  };\n  reader.readAsArrayBuffer(file);\n}\n\nfunction parseFile(key, raw) {\n  // Detect header row\n  let startRow = 0;\n  for (let i = 0; i < Math.min(10, raw.length); i++) {\n    if (raw[i] && raw[i].some(v => v && String(v).includes('رقم المستند'))) {\n      startRow = i + 1;\n      break;\n    }\n  }\n\n  const docs = new Set();\n  const items = [];\n\n  let currentDoc = null, currentRef = null;\n\n  for (let i = startRow; i < raw.length; i++) {\n    const row = raw[i];\n    if (!row || row.every(v => v === null || v === undefined || v === '')) continue;\n\n    const col0 = String(row[0] || '').trim();\n\n    if (key === 'n') {\n      // النهائي format: col0=docNo, col1=ref, col2=itemCode, col3=desc, col4=qty, col5=unit, col6=price, col7=amount\n      if (col0.startsWith('0006') || col0.startsWith('0005')) {\n        docs.add(col0);\n        items.push({\n          doc: col0,\n          ref: String(row[1] || '').trim(),\n          code: String(row[2] || '').trim(),\n          desc: String(row[3] || '').trim(),\n          qty: parseFloat(row[4]) || 0,\n          unit: String(row[5] || '').trim(),\n          price: parseFloat(String(row[6] || '0').replace(/,/g, '')) || 0,\n          amount: parseFloat(String(row[7] || '0').replace(/,/g, '')) || 0,\n          type: 'transfer'\n        });\n      }\n    } else {\n      // Transfers / Returns format\n      // Header rows have doc number in col0\n      if (col0.startsWith('0006') || col0.startsWith('0005')) {\n        // This is a document header row\n        currentDoc = col0;\n        // ref is in col7 for transfers, col7 for returns\n        currentRef = String(row[7] || row[1] || '').trim();\n        docs.add(currentDoc);\n      } else if (currentDoc && row[1] !== null && row[1] !== undefined && String(row[1]).trim() !== '' && !isNaN(parseFloat(String(row[1]).replace(/,/g, '')))) {\n        // Item row: col1=itemCode, col2=desc, col3=qty, col4=unit, col5=price, col6=amount\n        items.push({\n          doc: currentDoc,\n          ref: currentRef,\n          code: String(row[1] || '').trim(),\n          desc: String(row[2] || '').trim(),\n          qty: parseFloat(String(row[3] || '0').replace(/,/g, '')) || 0,\n          unit: String(row[4] || '').trim(),\n          price: parseFloat(String(row[5] || '0').replace(/,/g, '')) || 0,\n          amount: parseFloat(String(row[6] || '0').replace(/,/g, '')) || 0,\n          type: key === 'r' ? 'return' : 'transfer'\n        });\n      }\n    }\n  }\n\n  return { docs: docs.size, items: items.length, parsed: items };\n}\n\nfunction showStats(key, info) {\n  const el = document.getElementById(`stats-${key}`);\n  el.innerHTML = `\n    <div class=\"stat-chip\">Docs: <span>${info.docs}</span></div>\n    <div class=\"stat-chip\">Items: <span>${info.items}</span></div>\n  `;\n}\n\nfunction checkReady() {\n  document.getElementById('btn-process').disabled = !state.t;\n}\n\n// ===== Reference search with autocomplete suggestions + multi-select =====\n\n// Rebuilds the list of distinct reference numbers found across every\n// uploaded file (transfers + returns + final), used to power the\n// suggestions dropdown under the ref-search box.\nfunction rebuildRefIndex() {\n  const refs = new Set();\n  ['t', 'r', 'n'].forEach(key => {\n    if (!state[key]) return;\n    const parsed = parseFile(key, state[key].raw);\n    parsed.parsed.forEach(it => {\n      const ref = String(it.ref || '').trim();\n      if (ref) refs.add(ref);\n    });\n  });\n  state.allRefs = Array.from(refs).sort((a, b) => a.localeCompare(b));\n}\n\nfunction onRefSearchInput() {\n  const box = document.getElementById('ref-suggestions');\n  const q = document.getElementById('ref-search').value.trim().toLowerCase();\n\n  if (!q) { box.classList.remove('show'); box.innerHTML = ''; return; }\n\n  const matches = state.allRefs\n    .filter(r => r.toLowerCase().includes(q) && !state.selectedRefs.includes(r));\n\n  if (matches.length === 0) {\n    box.innerHTML = `<div class=\"ref-suggestion-empty\">No matching reference numbers</div>`;\n    box.classList.add('show');\n    return;\n  }\n\n  box.innerHTML = matches.map(r =>\n    `<div class=\"ref-suggestion-item\" onclick=\"addSelectedRef('${r.replace(/'/g, \"\\\\'\")}')\">${r}</div>`\n  ).join('');\n  box.classList.add('show');\n}\n\nfunction addSelectedRef(ref) {\n  if (!state.selectedRefs.includes(ref)) state.selectedRefs.push(ref);\n  const input = document.getElementById('ref-search');\n  input.value = '';\n  input.focus();\n  document.getElementById('ref-suggestions').classList.remove('show');\n  renderSelectedRefChips();\n}\n\nfunction removeSelectedRef(ref) {\n  state.selectedRefs = state.selectedRefs.filter(r => r !== ref);\n  renderSelectedRefChips();\n}\n\nfunction renderSelectedRefChips() {\n  const box = document.getElementById('ref-selected-chips');\n  if (state.selectedRefs.length === 0) {\n    box.style.display = 'none';\n    box.innerHTML = '';\n    return;\n  }\n  box.style.display = 'flex';\n  box.innerHTML = state.selectedRefs.map(r =>\n    `<span class=\"ref-chip\">${r}<button type=\"button\" onclick=\"removeSelectedRef('${r.replace(/'/g, \"\\\\'\")}')\">✕</button></span>`\n  ).join('');\n}\n\n// Hide the suggestions dropdown when clicking anywhere outside it\ndocument.addEventListener('click', e => {\n  const wrap = document.getElementById('ref-search-wrap');\n  const box = document.getElementById('ref-suggestions');\n  if (wrap && !wrap.contains(e.target)) box.classList.remove('show');\n});\n\n// ===== Reconcile tool output against an external sheet =====\n\nconst CODE_HEADERS = ['رمز الصنف', 'كود الصنف', 'item code', 'code', 'كود', 'رمز'];\nconst QTY_HEADERS   = ['item qty', 'الكمية الإجمالية', 'الكميات الصادرة', 'quantity', 'qty', 'الكمية', 'كمية'];\nconst DESC_HEADERS  = ['بيان الصنف', 'البيان', 'الوصف', 'اسم الصنف', 'description'];\n\n// Column detection strategy: an EXACT header match (e.g. a column literally\n// named \"ITEM QTY\") always wins over a looser SUBSTRING match (e.g. a\n// different column named \"QTY\" that merely contains the word). Without this,\n// sheets with both an order-level \"QTY\" and a material-level \"ITEM QTY\"\n// column would grab the wrong one just because it appears first.\nfunction findColumn(headerRow, candidates) {\n  // Pass 1: exact match, checked in candidate priority order\n  for (const cand of candidates) {\n    const idx = headerRow.findIndex(cell => String(cell || '').trim().toLowerCase() === cand.toLowerCase());\n    if (idx !== -1) return idx;\n  }\n  // Pass 2: substring match, checked in candidate priority order\n  for (const cand of candidates) {\n    const idx = headerRow.findIndex(cell => {\n      const c = String(cell || '').trim().toLowerCase();\n      return c && c.includes(cand.toLowerCase());\n    });\n    if (idx !== -1) return idx;\n  }\n  return -1;\n}\n\n// Normalize an item code for matching purposes: trims whitespace, drops\n// leading zeros, and removes any internal spaces — so \"0104010002\",\n// \"104010002\" and \" 104010002 \" are all treated as the same item.\nfunction normalizeCode(code) {\n  return String(code).trim().replace(/\\s+/g, '').replace(/^0+(?=\\d)/, '');\n}\n\nfunction parseExternalSheet(raw) {\n  // Find the row that looks like a header (contains a code-like AND qty-like label)\n  let headerRowIdx = -1, codeCol = -1, qtyCol = -1, descCol = -1;\n  for (let i = 0; i < Math.min(15, raw.length); i++) {\n    const row = raw[i];\n    if (!row) continue;\n    const c = findColumn(row, CODE_HEADERS);\n    const q = findColumn(row, QTY_HEADERS);\n    if (c !== -1 && q !== -1) {\n      headerRowIdx = i; codeCol = c; qtyCol = q;\n      descCol = findColumn(row, DESC_HEADERS);\n      break;\n    }\n  }\n\n  const groups = {};\n  if (headerRowIdx === -1) {\n    // Fallback: assume col0=code, col1=desc, col2=qty (common simple layout)\n    codeCol = 0; descCol = 1; qtyCol = 2; headerRowIdx = 0;\n  }\n\n  for (let i = headerRowIdx + 1; i < raw.length; i++) {\n    const row = raw[i];\n    if (!row || row.every(v => v === null || v === undefined || v === '')) continue;\n    const rawCode = String(row[codeCol] || '').trim();\n    if (!rawCode) continue;\n    const key = normalizeCode(rawCode);\n    if (!key) continue;\n    const qty = parseFloat(String(row[qtyCol] || '0').replace(/,/g, '')) || 0;\n    const desc = descCol !== -1 ? String(row[descCol] || '').trim() : '';\n    if (!groups[key]) groups[key] = { code: rawCode, desc, qty: 0 };\n    // Prefer the longer raw-code representation (e.g. keeps leading zeros) for display\n    if (rawCode.length > groups[key].code.length) groups[key].code = rawCode;\n    groups[key].qty += qty;\n    if (desc && !groups[key].desc) groups[key].desc = desc;\n  }\n  return groups;\n}\n\nfunction handleExternalSheet(input) {\n  const file = input.files[0];\n  if (!file) return;\n  const reader = new FileReader();\n  reader.onload = e => {\n    try {\n      const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });\n      const ws = wb.Sheets[wb.SheetNames[0]];\n      const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });\n      const groups = parseExternalSheet(raw);\n      const itemCount = Object.keys(groups).length;\n\n      if (itemCount === 0) {\n        document.getElementById('reconcile-log').innerHTML = '';\n        reconcileLog(\"Couldn't find an item-code column and a quantity column in this file — check the format\", 'err');\n        return;\n      }\n\n      state.ext = { raw, groups, file };\n      document.getElementById('fname-ext').textContent = '✓ ' + file.name;\n      document.getElementById('fname-ext').classList.add('show');\n      document.getElementById('zone-ext').classList.add('loaded');\n      document.getElementById('stats-ext').innerHTML =\n        `<div class=\"stat-chip\">Items: <span>${itemCount}</span></div>`;\n\n      document.getElementById('reconcile-log').innerHTML = '';\n      reconcileLog(`Loaded ${file.name} — ${itemCount} item(s)`, 'ok');\n    } catch (err) {\n      reconcileLog(`Error reading file: ${err.message}`, 'err');\n    }\n  };\n  reader.readAsArrayBuffer(file);\n}\n\n// Parse the tool's OWN downloaded output file (from downloadResult()).\n// Known headers: رقم المستند | رقم المرجع | تاريخ و رمز الصنف | بيان الوارد من مخزن |\n//                الكميات الصادرة | الوحده | السعر | مجموع المبلغ | رقم المرجع | نوع الحركة\nfunction parseToolOutputSheet(raw) {\n  let headerRowIdx = -1, codeCol = -1, qtyCol = -1, descCol = -1, typeCol = -1;\n\n  for (let i = 0; i < Math.min(10, raw.length); i++) {\n    const row = raw[i];\n    if (!row) continue;\n    const c = findColumn(row, ['تاريخ و رمز الصنف', 'رمز الصنف', 'كود الصنف']);\n    const q = findColumn(row, ['الكميات الصادرة', 'الكمية', 'qty']);\n    if (c !== -1 && q !== -1) {\n      headerRowIdx = i; codeCol = c; qtyCol = q;\n      descCol = findColumn(row, ['بيان الوارد من مخزن', 'البيان', 'الوصف']);\n      typeCol = findColumn(row, ['نوع الحركة', 'النوع']);\n      break;\n    }\n  }\n\n  const groups = {};\n  if (headerRowIdx === -1) {\n    // Fallback: use the generic external-sheet parser\n    return parseExternalSheet(raw);\n  }\n\n  for (let i = headerRowIdx + 1; i < raw.length; i++) {\n    const row = raw[i];\n    if (!row || row.every(v => v === null || v === undefined || v === '')) continue;\n    const rawCode = String(row[codeCol] || '').trim();\n    if (!rawCode) continue;\n    const key = normalizeCode(rawCode);\n    if (!key) continue;\n    const qty = parseFloat(String(row[qtyCol] || '0').replace(/,/g, '')) || 0;\n    const desc = descCol !== -1 ? String(row[descCol] || '').trim() : '';\n    const typeVal = typeCol !== -1 ? String(row[typeCol] || '').trim().toUpperCase() : '';\n    const sign = typeVal.includes('REFUND') ? -1 : 1;\n\n    if (!groups[key]) groups[key] = { code: rawCode, desc, qty: 0 };\n    if (rawCode.length > groups[key].code.length) groups[key].code = rawCode;\n    groups[key].qty += sign * qty;\n    if (desc && !groups[key].desc) groups[key].desc = desc;\n  }\n  return groups;\n}\n\nfunction handleToolOutputSheet(input) {\n  const file = input.files[0];\n  if (!file) return;\n  const reader = new FileReader();\n  reader.onload = e => {\n    try {\n      const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });\n      const ws = wb.Sheets[wb.SheetNames[0]];\n      const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });\n      const groups = parseToolOutputSheet(raw);\n      const itemCount = Object.keys(groups).length;\n\n      if (itemCount === 0) {\n        document.getElementById('reconcile-log').innerHTML = '';\n        reconcileLog(\"Couldn't find item/quantity columns in the tool-output file — make sure it's the same file downloaded from the Inventory Transfer tab\", 'err');\n        return;\n      }\n\n      state.toolout = { raw, groups, file };\n      document.getElementById('fname-toolout').textContent = '✓ ' + file.name;\n      document.getElementById('fname-toolout').classList.add('show');\n      document.getElementById('zone-toolout').classList.add('loaded');\n      document.getElementById('stats-toolout').innerHTML =\n        `<div class=\"stat-chip\">Items: <span>${itemCount}</span></div>`;\n\n      document.getElementById('reconcile-log').innerHTML = '';\n      reconcileLog(`Loaded ${file.name} — ${itemCount} item(s)`, 'ok');\n    } catch (err) {\n      reconcileLog(`Error reading file: ${err.message}`, 'err');\n    }\n  };\n  reader.readAsArrayBuffer(file);\n}\n\nfunction reconcileLog(msg, type = '') {\n  const el = document.getElementById('reconcile-log');\n  const line = document.createElement('div');\n  line.className = type ? `log-${type}` : '';\n  line.textContent = `[${new Date().toLocaleTimeString('en-US')}] ${msg}`;\n  el.appendChild(line);\n  el.scrollTop = el.scrollHeight;\n}\n\nfunction runReconciliation() {\n  try {\n  if (!state.toolout) {\n    reconcileLog('Please upload the \"Tool Output\" file (the final file you downloaded from the Inventory Transfer tab)', 'warn');\n    return;\n  }\n  if (!state.ext) {\n    reconcileLog('Please upload the External Sheet first', 'warn');\n    return;\n  }\n\n  const toolGroups = state.toolout.groups;\n  const extGroups = state.ext.groups;\n  const allCodes = new Set([...Object.keys(toolGroups), ...Object.keys(extGroups)]);\n\n  const rows = [];\n  let matchedCount = 0, diff = 0, only1 = 0, only2 = 0;\n\n  allCodes.forEach(code => {\n    const inTool = toolGroups[code];\n    const inExt = extGroups[code];\n    const qty1 = inTool ? inTool.qty : 0;\n    const qty2 = inExt ? inExt.qty : 0;\n    const desc = (inTool && inTool.desc) || (inExt && inExt.desc) || '';\n    // Prefer the longer raw-code representation (keeps leading zeros) for display\n    const rawCode = (inTool && inExt)\n      ? (inTool.code.length >= inExt.code.length ? inTool.code : inExt.code)\n      : (inTool ? inTool.code : inExt.code);\n    const d = qty2 - qty1;\n\n    let status;\n    if (!inTool) { status = 'External Sheet Only'; only2++; }\n    else if (!inExt) { status = 'Tool Output Only'; only1++; }\n    else if (d === 0) { status = 'Matched'; matchedCount++; }\n    else { status = 'Mismatched'; diff++; }\n\n    rows.push({ code: rawCode, desc, qty1, qty2, diff: d, status });\n  });\n\n  // Sort: differences and mismatches first\n  rows.sort((a, b) => (a.status === 'Matched') - (b.status === 'Matched'));\n\n  state.reconcileResult = { ref: new Date().toISOString().slice(0,10), rows };\n\n  document.getElementById('reconcile-result-title').textContent = `✅ Reconciliation Result`;\n  document.getElementById('rec-matched').textContent = matchedCount;\n  document.getElementById('rec-diff').textContent = diff;\n  document.getElementById('rec-only1').textContent = only1;\n  document.getElementById('rec-only2').textContent = only2;\n\n  const tbody = document.getElementById('reconcile-body');\n  tbody.innerHTML = '';\n  rows.forEach(r => {\n    const tr = document.createElement('tr');\n    const diffColor = r.diff !== 0 ? 'color:var(--red);font-weight:700' : '';\n    tr.innerHTML = `\n      <td>${r.code}</td>\n      <td style=\"max-width:220px;overflow:hidden;text-overflow:ellipsis\">${r.desc}</td>\n      <td>${r.qty1.toLocaleString('en-US')}</td>\n      <td>${r.qty2.toLocaleString('en-US')}</td>\n      <td style=\"${diffColor}\">${r.diff.toLocaleString('en-US')}</td>\n      <td>${r.status}</td>\n    `;\n    tbody.appendChild(tr);\n  });\n\n  document.getElementById('reconcile-result-card').classList.add('show');\n  reconcileLog(`✅ Reconciliation complete — ${rows.length} item(s) (${matchedCount} matched, ${diff} mismatched, ${only1} tool-output only, ${only2} external-sheet only)`, 'ok');\n  } catch (err) {\n    reconcileLog(`Unexpected error during reconciliation: ${err.message}`, 'err');\n  }\n}\n\nfunction downloadReconcileResult() {\n  if (!state.reconcileResult) return;\n\n  const wb = XLSX.utils.book_new();\n  const headers = ['Item Code', 'Description', 'Qty - Transfers/Returns', 'Qty - External Sheet', 'Difference', 'Status'];\n  const wsData = [headers, ...state.reconcileResult.rows.map(r => [r.code, r.desc, r.qty1, r.qty2, r.diff, r.status])];\n\n  const ws = XLSX.utils.aoa_to_sheet(wsData);\n  ws['!cols'] = [{wch:14},{wch:40},{wch:20},{wch:18},{wch:10},{wch:24}];\n\n  XLSX.utils.book_append_sheet(wb, ws, 'Reconciliation');\n  XLSX.writeFile(wb, `Reconciliation_${state.reconcileResult.ref}.xlsx`);\n  reconcileLog('Reconciliation file downloaded', 'ok');\n}\n\n// ===== Match the tool sheet against the final sheet (by item name and quantity) =====\n\n// Normalize an Arabic/English item name for matching purposes: strips\n// diacritics, unifies common Arabic letter variants (alef forms, ya/alef\n// maqsura, ta marbuta/ha), collapses whitespace, and lowercases — so minor\n// spelling/spacing differences between the two sheets don't break a match.\nfunction normalizeName(name) {\n  let s = String(name || '').trim();\n  s = s.replace(/[\\u064B-\\u065F\\u0670]/g, '');   // Arabic diacritics\n  s = s.replace(/[إأآا]/g, 'ا');\n  s = s.replace(/ى/g, 'ي');\n  s = s.replace(/ة/g, 'ه');\n  s = s.replace(/\\s+/g, ' ').trim();\n  return s.toLowerCase();\n}\n\nfunction namematchLog(msg, type = '') {\n  const el = document.getElementById('namematch-log');\n  const line = document.createElement('div');\n  line.className = type ? `log-${type}` : '';\n  line.textContent = `[${new Date().toLocaleTimeString('en-US')}] ${msg}`;\n  el.appendChild(line);\n  el.scrollTop = el.scrollHeight;\n}\n\n// Parses the tool's own downloaded output file, grouping by ITEM NAME\n// (rather than code) and summing quantity. Returns rows are already made\n// negative for return rows (نوع الحركة MATERIALS REFUND).\nfunction parseToolOutputByName(raw) {\n  let headerRowIdx = -1, nameCol = -1, qtyCol = -1, typeCol = -1;\n\n  // Pass 1: look for the tool's own specific column names\n  for (let i = 0; i < Math.min(10, raw.length); i++) {\n    const row = raw[i];\n    if (!row) continue;\n    const n = findColumn(row, ['بيان الوارد من مخزن', 'البيان', 'الوصف', 'اسم الصنف']);\n    const q = findColumn(row, ['الكميات الصادرة', 'الكمية', 'qty']);\n    if (n !== -1 && q !== -1) {\n      headerRowIdx = i; nameCol = n; qtyCol = q;\n      typeCol = findColumn(row, ['نوع الحركة', 'النوع']);\n      break;\n    }\n  }\n\n  // Pass 2: fall back to the broader generic header lists (in case the\n  // sheet was re-saved/renamed slightly) before giving up entirely\n  if (headerRowIdx === -1) {\n    for (let i = 0; i < Math.min(10, raw.length); i++) {\n      const row = raw[i];\n      if (!row) continue;\n      const n = findColumn(row, DESC_HEADERS);\n      const q = findColumn(row, QTY_HEADERS);\n      if (n !== -1 && q !== -1) {\n        headerRowIdx = i; nameCol = n; qtyCol = q;\n        typeCol = findColumn(row, ['نوع الحركة', 'النوع', 'type']);\n        break;\n      }\n    }\n  }\n\n  // Pass 3: last-resort fallback — assume the exact column layout produced\n  // by this tool's own downloadResult() (desc=col3, qty=col4, type=col9)\n  if (headerRowIdx === -1 && raw.length > 1) {\n    headerRowIdx = 0; nameCol = 3; qtyCol = 4; typeCol = 9;\n  }\n\n  const groups = {};\n  if (headerRowIdx === -1) return groups;\n\n  for (let i = headerRowIdx + 1; i < raw.length; i++) {\n    const row = raw[i];\n    if (!row || row.every(v => v === null || v === undefined || v === '')) continue;\n    const rawName = String(row[nameCol] || '').trim();\n    if (!rawName) continue;\n    const key = normalizeName(rawName);\n    if (!key) continue;\n    const qty = parseFloat(String(row[qtyCol] || '0').replace(/,/g, '')) || 0;\n    const typeVal = typeCol !== -1 ? String(row[typeCol] || '').trim().toUpperCase() : '';\n    const sign = typeVal.includes('REFUND') ? -1 : 1;\n\n    if (!groups[key]) groups[key] = { name: rawName, qty: 0 };\n    groups[key].qty += sign * qty;\n  }\n  return groups;\n}\n\n// Parses the \"Final Sheet\" file, grouping by ITEM NAME and summing\n// quantity, after excluding the first 5 and last 5 non-empty DATA rows\n// (rows after the detected header) as requested — these are typically\n// title/summary/signature rows rather than actual item rows.\nfunction parseFinalSheetByName(raw) {\n  let headerRowIdx = -1, nameCol = -1, qtyCol = -1;\n\n  for (let i = 0; i < Math.min(15, raw.length); i++) {\n    const row = raw[i];\n    if (!row) continue;\n    const n = findColumn(row, DESC_HEADERS);\n    const q = findColumn(row, QTY_HEADERS);\n    if (n !== -1 && q !== -1) {\n      headerRowIdx = i; nameCol = n; qtyCol = q;\n      break;\n    }\n  }\n\n  const startRow = headerRowIdx === -1 ? 0 : headerRowIdx + 1;\n  if (headerRowIdx === -1) { nameCol = 0; qtyCol = 2; } // fallback layout: col A = name, col C = quantity\n\n  const dataRows = [];\n  for (let i = startRow; i < raw.length; i++) {\n    const row = raw[i];\n    if (!row || row.every(v => v === null || v === undefined || v === '')) continue;\n    dataRows.push(row);\n  }\n\n  // Exclude first 5 and last 5 data rows\n  const excludedStart = Math.min(5, dataRows.length);\n  const excludedEnd = Math.min(5, Math.max(0, dataRows.length - excludedStart));\n  const trimmed = dataRows.length > excludedStart + excludedEnd\n    ? dataRows.slice(excludedStart, dataRows.length - excludedEnd)\n    : [];\n\n  const groups = {};\n  trimmed.forEach(row => {\n    const rawName = String(row[nameCol] || '').trim();\n    if (!rawName) return;\n    const key = normalizeName(rawName);\n    if (!key) return;\n    const qty = parseFloat(String(row[qtyCol] || '0').replace(/,/g, '')) || 0;\n    if (!groups[key]) groups[key] = { name: rawName, qty: 0 };\n    groups[key].qty += qty;\n  });\n\n  return { groups, totalDataRows: dataRows.length, keptRows: trimmed.length, excludedCount: dataRows.length - trimmed.length };\n}\n\nfunction handleToolNameSheet(input) {\n  const file = input.files[0];\n  if (!file) return;\n  const reader = new FileReader();\n  reader.onload = e => {\n    try {\n      const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });\n      const ws = wb.Sheets[wb.SheetNames[0]];\n      const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });\n      const groups = parseToolOutputByName(raw);\n      const itemCount = Object.keys(groups).length;\n\n      if (itemCount === 0) {\n        document.getElementById('namematch-log').innerHTML = '';\n        namematchLog(\"Couldn't find an item-name column and a quantity column in the tool sheet — make sure it's the same file downloaded from the Inventory Transfer tab\", 'err');\n        return;\n      }\n\n      state.toolname = { raw, groups, file };\n      document.getElementById('fname-toolname').textContent = '✓ ' + file.name;\n      document.getElementById('fname-toolname').classList.add('show');\n      document.getElementById('zone-toolname').classList.add('loaded');\n      document.getElementById('stats-toolname').innerHTML =\n        `<div class=\"stat-chip\">Items: <span>${itemCount}</span></div>`;\n\n      document.getElementById('namematch-log').innerHTML = '';\n      namematchLog(`Loaded ${file.name} — ${itemCount} item(s)`, 'ok');\n    } catch (err) {\n      namematchLog(`Error reading file: ${err.message}`, 'err');\n    }\n  };\n  reader.readAsArrayBuffer(file);\n}\n\nfunction handleFinalSheet(input) {\n  const file = input.files[0];\n  if (!file) return;\n  const reader = new FileReader();\n  reader.onload = e => {\n    try {\n      const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });\n      const ws = wb.Sheets[wb.SheetNames[0]];\n      const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });\n      const { groups, totalDataRows, keptRows, excludedCount } = parseFinalSheetByName(raw);\n      const itemCount = Object.keys(groups).length;\n\n      if (itemCount === 0) {\n        document.getElementById('namematch-log').innerHTML = '';\n        namematchLog(\"Couldn't find an item-name column and a quantity column in the final sheet — check the format\", 'err');\n        return;\n      }\n\n      state.finalsheet = { raw, groups, file };\n      document.getElementById('fname-finalsheet').textContent = '✓ ' + file.name;\n      document.getElementById('fname-finalsheet').classList.add('show');\n      document.getElementById('zone-finalsheet').classList.add('loaded');\n      document.getElementById('stats-finalsheet').innerHTML =\n        `<div class=\"stat-chip\">Items: <span>${itemCount}</span></div>\n         <div class=\"stat-chip\">Excluded rows: <span>${excludedCount}</span></div>`;\n\n      document.getElementById('namematch-log').innerHTML = '';\n      namematchLog(`Loaded ${file.name} — ${totalDataRows} data row(s), excluded ${excludedCount} (first 5 + last 5), ${keptRows} row(s) remaining → ${itemCount} item(s)`, 'ok');\n    } catch (err) {\n      namematchLog(`Error reading file: ${err.message}`, 'err');\n    }\n  };\n  reader.readAsArrayBuffer(file);\n}\n\nfunction runNameMatch() {\n  try {\n  if (!state.toolname) {\n    namematchLog('Please upload the \"Tool Sheet\" first', 'warn');\n    return;\n  }\n  if (!state.finalsheet) {\n    namematchLog('Please upload the \"Final Sheet\" first', 'warn');\n    return;\n  }\n\n  const toolGroups = state.toolname.groups;\n  const finalGroups = state.finalsheet.groups;\n  const allKeys = new Set([...Object.keys(toolGroups), ...Object.keys(finalGroups)]);\n\n  const rows = [];\n  let matchedCount = 0, diff = 0, only1 = 0, only2 = 0;\n\n  allKeys.forEach(key => {\n    const inTool = toolGroups[key];\n    const inFinal = finalGroups[key];\n    const qty1 = inTool ? inTool.qty : 0;\n    const qty2 = inFinal ? inFinal.qty : 0;\n    const name = (inTool && inTool.name) || (inFinal && inFinal.name) || '';\n    const d = qty2 - qty1;\n\n    let status;\n    if (!inTool) { status = 'Final Sheet Only'; only2++; }\n    else if (!inFinal) { status = 'Tool Sheet Only'; only1++; }\n    else if (d === 0) { status = 'Matched'; matchedCount++; }\n    else { status = 'Mismatched'; diff++; }\n\n    rows.push({ name, qty1, qty2, diff: d, status });\n  });\n\n  // Sort: differences and mismatches first\n  rows.sort((a, b) => (a.status === 'Matched') - (b.status === 'Matched'));\n\n  state.namematchResult = { ref: new Date().toISOString().slice(0,10), rows };\n\n  document.getElementById('namematch-result-title').textContent = `✅ Matching Result`;\n  document.getElementById('nm-matched').textContent = matchedCount;\n  document.getElementById('nm-diff').textContent = diff;\n  document.getElementById('nm-only1').textContent = only1;\n  document.getElementById('nm-only2').textContent = only2;\n\n  const tbody = document.getElementById('namematch-body');\n  tbody.innerHTML = '';\n  rows.forEach(r => {\n    const tr = document.createElement('tr');\n    const diffColor = r.diff !== 0 ? 'color:var(--red);font-weight:700' : '';\n    tr.innerHTML = `\n      <td style=\"max-width:280px;overflow:hidden;text-overflow:ellipsis\">${r.name}</td>\n      <td>${r.qty1.toLocaleString('en-US')}</td>\n      <td>${r.qty2.toLocaleString('en-US')}</td>\n      <td style=\"${diffColor}\">${r.diff.toLocaleString('en-US')}</td>\n      <td>${r.status}</td>\n    `;\n    tbody.appendChild(tr);\n  });\n\n  document.getElementById('namematch-result-card').classList.add('show');\n  namematchLog(`✅ Matching complete — ${rows.length} item(s) (${matchedCount} matched, ${diff} mismatched, ${only1} tool-sheet only, ${only2} final-sheet only)`, 'ok');\n  } catch (err) {\n    namematchLog(`Unexpected error during matching: ${err.message}`, 'err');\n  }\n}\n\nfunction downloadNameMatchResult() {\n  if (!state.namematchResult) return;\n\n  const wb = XLSX.utils.book_new();\n  const headers = ['Item Name', 'Qty - Tool Sheet', 'Qty - Final Sheet', 'Difference', 'Status'];\n  const wsData = [headers, ...state.namematchResult.rows.map(r => [r.name, r.qty1, r.qty2, r.diff, r.status])];\n\n  const ws = XLSX.utils.aoa_to_sheet(wsData);\n  ws['!cols'] = [{wch:40},{wch:20},{wch:18},{wch:10},{wch:24}];\n\n  XLSX.utils.book_append_sheet(wb, ws, 'Matching');\n  XLSX.writeFile(wb, `Matching_${state.namematchResult.ref}.xlsx`);\n  namematchLog('Matching file downloaded', 'ok');\n}\n\n// ===== Uncosted Orders (طلبات لم تُكلّف) =====\n// Cross-references the Final sheet's order references against a Finished\n// Cost sheet and a multi-sheet Order Status workbook, to triage which\n// orders already have a finished cost document vs. which don't and need\n// follow-up based on their delivery status.\n\nstate.uncosted = { final: null, cost: null, status: null, result: null };\n\nfunction uncostedLog(msg, type = '') {\n  const el = document.getElementById('uncosted-log');\n  const line = document.createElement('div');\n  line.className = type ? `log-${type}` : '';\n  line.textContent = `[${new Date().toLocaleTimeString('en-US')}] ${msg}`;\n  el.appendChild(line);\n  el.scrollTop = el.scrollHeight;\n}\n\n// Finished Cost sheet: a small, simply-laid-out sheet whose header row\n// isn't always row 1, with a column combining \"SALES ORDER OR SHOWROOM\n// (QUTO) NUMBER\" (sometimes misspelled \"OERDER\") in one cell — detected by\n// a cell containing both \"sales\" and \"order\"/\"oerder\"/\"quto\".\nfunction parseFinishedCostSheet(raw) {\n  let headerRowIdx = -1, refCol = -1, costDocCol = -1, dateCol = -1, descCol = -1;\n\n  for (let i = 0; i < Math.min(10, raw.length); i++) {\n    const row = raw[i];\n    if (!row) continue;\n    for (let c = 0; c < row.length; c++) {\n      const cell = String(row[c] || '').toLowerCase().replace(/\\s+/g, ' ');\n      if (cell.includes('sales') && (cell.includes('order') || cell.includes('oerder') || cell.includes('quto'))) {\n        refCol = c;\n      }\n      if (cell.includes('cost document') && cell.includes('number')) costDocCol = c;\n      if (cell.includes('date of done') || (cell.includes('date') && cell.includes('cost'))) dateCol = c;\n      if (cell.includes('decription') || cell.includes('description')) descCol = c;\n    }\n    if (refCol !== -1) { headerRowIdx = i; break; }\n  }\n  if (headerRowIdx === -1) return null;\n\n  const refs = new Set();\n  const rows = [];\n  for (let i = headerRowIdx + 1; i < raw.length; i++) {\n    const row = raw[i];\n    if (!row || row.every(v => v === null || v === undefined || v === '')) continue;\n    const refVal = String(row[refCol] ?? '').trim();\n    if (!refVal) continue;\n    refs.add(refVal);\n    rows.push({\n      ref: refVal,\n      costDocNumber: costDocCol !== -1 ? String(row[costDocCol] ?? '').trim() : '',\n      date: dateCol !== -1 ? row[dateCol] : null,\n      desc: descCol !== -1 ? String(row[descCol] ?? '').trim() : ''\n    });\n  }\n  return { refs, rows };\n}\n\nconst UC_STATUS_HEADERS = {\n  workOrder: ['work order no', 'work order'],\n  deliveryDate: ['delivery date', 'delivery  date'],\n  emailDate: ['email date', 'drive /email date', 'drive  email date', 'drive/email date'],\n  packing: ['packing'],\n  paymentMode: ['payment mode'],\n  deliveryStatus: ['delivery status']\n};\n\nfunction findUcStatusHeaderRow(raw) {\n  for (let i = 0; i < Math.min(10, raw.length); i++) {\n    const row = raw[i];\n    if (!row) continue;\n    const normCells = row.map(v => String(v || '').toLowerCase().replace(/[.]/g, '').replace(/\\s+/g, ' ').trim());\n    const findCol = candidates => {\n      for (const cand of candidates) {\n        const idx = normCells.findIndex(c => c === cand);\n        if (idx !== -1) return idx;\n      }\n      for (const cand of candidates) {\n        const idx = normCells.findIndex(c => c.includes(cand));\n        if (idx !== -1) return idx;\n      }\n      return -1;\n    };\n    const workOrderCol = findCol(UC_STATUS_HEADERS.workOrder);\n    if (workOrderCol === -1) continue;\n    return {\n      headerRowIdx: i,\n      workOrderCol,\n      deliveryDateCol: findCol(UC_STATUS_HEADERS.deliveryDate),\n      emailDateCol: findCol(UC_STATUS_HEADERS.emailDate),\n      packingCol: findCol(UC_STATUS_HEADERS.packing),\n      paymentModeCol: findCol(UC_STATUS_HEADERS.paymentMode),\n      deliveryStatusCol: findCol(UC_STATUS_HEADERS.deliveryStatus)\n    };\n  }\n  return null;\n}\n\n// Scans every sheet in the workbook (sheets with no \"Work Order\" column —\n// dashboards, charts, pivots — are naturally skipped) and merges everything\n// found into one lookup keyed by order reference. Column positions vary\n// sheet to sheet, so each sheet is detected independently; whichever of the\n// 5 optional columns a given sheet doesn't have are simply left blank for\n// rows from that sheet.\nfunction parseOrderStatusWorkbook(wb) {\n  const map = {};\n  wb.SheetNames.forEach(sheetName => {\n    const raw = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: null });\n    const hdr = findUcStatusHeaderRow(raw);\n    if (!hdr) return;\n\n    for (let i = hdr.headerRowIdx + 1; i < raw.length; i++) {\n      const row = raw[i];\n      if (!row || row.every(v => v === null || v === undefined || v === '')) continue;\n      const workOrder = String(row[hdr.workOrderCol] ?? '').trim();\n      if (!workOrder) continue;\n      if (map[workOrder]) continue; // first sheet to mention an order wins\n\n      map[workOrder] = {\n        deliveryDate: hdr.deliveryDateCol !== -1 ? row[hdr.deliveryDateCol] : null,\n        emailDate: hdr.emailDateCol !== -1 ? row[hdr.emailDateCol] : null,\n        packing: hdr.packingCol !== -1 ? row[hdr.packingCol] : null,\n        paymentMode: hdr.paymentModeCol !== -1 ? row[hdr.paymentModeCol] : null,\n        deliveryStatus: hdr.deliveryStatusCol !== -1 ? String(row[hdr.deliveryStatusCol] ?? '').trim() : '',\n        sheet: sheetName\n      };\n    }\n  });\n  return map;\n}\n\nfunction handleUncostedFile(kind, input) {\n  const file = input.files[0];\n  if (!file) return;\n  const reader = new FileReader();\n  reader.onload = e => {\n    try {\n      const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });\n\n      if (kind === 'final') {\n        const ws = wb.Sheets[wb.SheetNames[0]];\n        const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });\n        const parsed = parseFile('n', raw);\n        if (!parsed.parsed.length) throw new Error(\"Couldn't find any رقم المرجع rows — check this is the النهائي file\");\n        state.uncosted.final = parsed.parsed;\n        document.getElementById('stats-uc-final').innerHTML = `<div class=\"stat-chip\">Rows: <span>${parsed.parsed.length}</span></div>`;\n      } else if (kind === 'cost') {\n        const ws = wb.Sheets[wb.SheetNames[0]];\n        const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });\n        const parsed = parseFinishedCostSheet(raw);\n        if (!parsed) throw new Error(\"Couldn't find a sales-order column — check this is the finished cost sheet\");\n        state.uncosted.cost = parsed;\n        document.getElementById('stats-uc-cost').innerHTML = `<div class=\"stat-chip\">Orders: <span>${parsed.refs.size}</span></div>`;\n      } else if (kind === 'status') {\n        const map = parseOrderStatusWorkbook(wb);\n        if (Object.keys(map).length === 0) throw new Error(\"Couldn't find a Work Order column in any sheet\");\n        state.uncosted.status = map;\n        document.getElementById('stats-uc-status').innerHTML = `<div class=\"stat-chip\">Orders: <span>${Object.keys(map).length}</span></div>`;\n      }\n\n      document.getElementById(`fname-uc-${kind}`).textContent = '✓ ' + file.name;\n      document.getElementById(`fname-uc-${kind}`).classList.add('show');\n      document.getElementById(`zone-uc-${kind}`).classList.add('loaded');\n      uncostedLog(`Loaded ${file.name}`, 'ok');\n\n      if (state.uncosted.final && state.uncosted.cost && state.uncosted.status) {\n        runUncostedAnalysis();\n      }\n    } catch (err) {\n      uncostedLog(`Error reading file: ${err.message}`, 'err');\n    }\n  };\n  reader.readAsArrayBuffer(file);\n}\n\nfunction runUncostedAnalysis() {\n  const { final, cost, status } = state.uncosted;\n  const buckets = { costed: [], delivered: [], other: [], notfound: [] };\n\n  // Group the Final sheet's transaction lines by reference first, so every\n  // line for a given order lands in the same bucket.\n  const byRef = {};\n  final.forEach(item => {\n    if (!byRef[item.ref]) byRef[item.ref] = [];\n    byRef[item.ref].push(item);\n  });\n\n  Object.keys(byRef).forEach(ref => {\n    const lines = byRef[ref];\n    if (cost.refs.has(ref)) {\n      const costInfo = cost.rows.find(r => r.ref === ref);\n      lines.forEach(line => buckets.costed.push({ ...line, costDocNumber: costInfo ? costInfo.costDocNumber : '', costDocDate: costInfo ? costInfo.date : null }));\n      return;\n    }\n    const statusInfo = status[ref];\n    if (statusInfo) {\n      const target = /delivered/i.test(statusInfo.deliveryStatus) ? buckets.delivered : buckets.other;\n      lines.forEach(line => target.push({ ...line, ...statusInfo }));\n      return;\n    }\n    lines.forEach(line => buckets.notfound.push(line));\n  });\n\n  state.uncosted.result = buckets;\n  renderUncostedResult();\n}\n\nfunction renderUncostedResult() {\n  const { costed, delivered, other, notfound } = state.uncosted.result;\n  const uniqueRefs = arr => new Set(arr.map(r => r.ref)).size;\n\n  document.getElementById('uc-count-costed').textContent = uniqueRefs(costed);\n  document.getElementById('uc-count-delivered').textContent = uniqueRefs(delivered);\n  document.getElementById('uc-count-other').textContent = uniqueRefs(other);\n  document.getElementById('uc-count-notfound').textContent = uniqueRefs(notfound);\n\n  document.getElementById('uc-btn-costed').disabled = costed.length === 0;\n  document.getElementById('uc-btn-delivered').disabled = delivered.length === 0;\n  document.getElementById('uc-btn-other').disabled = other.length === 0;\n  document.getElementById('uc-btn-notfound').disabled = notfound.length === 0;\n\n  document.getElementById('uncosted-result-card').style.display = 'block';\n  uncostedLog(`Classified ${uniqueRefs(costed)} costed, ${uniqueRefs(delivered)} delivered-no-email, ${uniqueRefs(other)} other-status, ${uniqueRefs(notfound)} not-found orders`, 'ok');\n}\n\nfunction fmtUcDate(v) {\n  if (!v) return '';\n  if (v instanceof Date) return v.toISOString().split('T')[0];\n  return String(v);\n}\n\nfunction downloadUncostedCategory(category) {\n  if (!state.uncosted.result) return;\n  const rows = state.uncosted.result[category];\n  if (!rows || rows.length === 0) return;\n\n  const wb = XLSX.utils.book_new();\n  let headers, data, sheetName, filePrefix;\n\n  if (category === 'costed') {\n    headers = ['Doc No.', 'Ref No.', 'Item Code', 'Description', 'Qty', 'Unit', 'Price', 'Amount', 'Cost Doc Number', 'Cost Doc Date'];\n    data = rows.map(r => [r.doc, r.ref, r.code, r.desc, r.qty, r.unit, r.price, r.amount, r.costDocNumber, fmtUcDate(r.costDocDate)]);\n    sheetName = 'Finished Cost';\n    filePrefix = 'FinishedCost';\n  } else if (category === 'notfound') {\n    headers = ['Doc No.', 'Ref No.', 'Item Code', 'Description', 'Qty', 'Unit', 'Price', 'Amount'];\n    data = rows.map(r => [r.doc, r.ref, r.code, r.desc, r.qty, r.unit, r.price, r.amount]);\n    sheetName = 'Not Found';\n    filePrefix = 'NotFound';\n  } else {\n    headers = ['Doc No.', 'Ref No.', 'Item Code', 'Description', 'Qty', 'Unit', 'Price', 'Amount', 'Work Order', 'Email Date', 'Packing', 'Payment Mode', 'Delivery Date', 'Delivery Status'];\n    data = rows.map(r => [r.doc, r.ref, r.code, r.desc, r.qty, r.unit, r.price, r.amount, r.ref, fmtUcDate(r.emailDate), r.packing || '', r.paymentMode || '', fmtUcDate(r.deliveryDate), r.deliveryStatus || '']);\n    sheetName = category === 'delivered' ? 'Delivered No Email' : 'Other Statuses';\n    filePrefix = category === 'delivered' ? 'DeliveredNoEmail' : 'OtherStatuses';\n  }\n\n  const ws = XLSX.utils.aoa_to_sheet([headers, ...data]);\n  ws['!cols'] = headers.map(() => ({ wch: 16 }));\n  XLSX.utils.book_append_sheet(wb, ws, sheetName);\n\n  const today = new Date().toISOString().split('T')[0];\n  XLSX.writeFile(wb, `${filePrefix}_${today}.xlsx`);\n  uncostedLog(`Downloaded ${sheetName}`, 'ok');\n}\n\n// Header aliases used by the Work In Process statement parser.\nconst LEDGER_REF_HEADERS = ['رقم المرجع', 'reference', 'ref'];\nconst LEDGER_DESC_HEADERS = ['تعريف', 'اسم الحساب', 'اسم المورد', 'البيان', 'description'];\nconst LEDGER_DATE_HEADERS = ['تاريخ العملية', 'التاريخ', 'تاريخ القيد', 'date', 'posting date'];\nconst LEDGER_DEBIT_HEADERS = ['مدين', 'debit'];\ncon
