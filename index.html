<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر الورشة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #F6F1E7;
    --panel: #FFFDF9;
    --ink: #2E2620;
    --walnut: #6B4226;
    --walnut-dark: #4A2E19;
    --amber: #C68642;
    --border: #E0D3BC;
    --border-soft: #EFE6D6;
    --muted: #8A7A63;
    --danger: #B4483D;
    --danger-bg: #FBEAE6;
    --danger-border: #E9C3BB;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
  .loading-wrap { display:flex; align-items:center; justify-content:center; padding:48px 16px; color: var(--walnut); gap:8px; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .header { background: linear-gradient(135deg, var(--walnut) 0%, var(--walnut-dark) 100%); padding: 20px 24px; }
  .header-inner { display:flex; align-items:center; gap:12px; max-width:1100px; margin:0 auto; }
  .title { font-family:'Cairo',sans-serif; font-weight:800; font-size:22px; color: var(--bg); margin:0; }
  .subtitle { margin:2px 0 0; font-size:13px; color:#D9C6AE; }

  .tabs { display:flex; gap:4px; padding:10px 16px 0; max-width:1100px; margin:0 auto; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .tab-btn { display:flex; align-items:center; gap:6px; padding:10px 16px; background:transparent; border:none; border-bottom:3px solid transparent; color: var(--muted); font-family:'Tajawal',sans-serif; font-size:14px; font-weight:500; cursor:pointer; }
  .tab-btn.active { color: var(--walnut); border-bottom:3px solid var(--amber); font-weight:700; }

  .error-banner { max-width:1100px; margin:16px auto 0; background: var(--danger-bg); color: var(--danger); border:1px solid var(--danger-border); border-radius:8px; padding:10px 14px; font-size:14px; }

  main { max-width:1100px; margin:0 auto; padding:20px 16px 48px; }
  .card { background: var(--panel); border:1px solid var(--border); border-radius:12px; padding:22px; box-shadow:0 1px 3px rgba(74,46,25,0.06); margin-bottom:20px; }
  .card-title { font-family:'Cairo',sans-serif; font-size:17px; font-weight:700; margin:0 0 14px; color: var(--walnut-dark); }

  .grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:14px; }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field-label { font-size:13px; color: var(--muted); font-weight:500; }
  .input, select, input[type=text], input[type=number], input[type=time] { font-family:'Tajawal',sans-serif; font-size:14px; padding:10px 12px; border-radius:8px; border:1px solid #DDD0BC; background:#fff; color: var(--ink); outline:none; width:100%; }

  .preview-box { margin-top:20px; display:flex; align-items:center; justify-content:center; gap:24px; background:#F6EFE3; border:1px dashed var(--amber); border-radius:10px; padding:16px 20px; flex-wrap:wrap; }
  .preview-item { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .preview-label { font-size:12px; color: var(--muted); }
  .preview-value { font-family:'Cairo',sans-serif; font-size:24px; font-weight:800; color: var(--walnut); }
  .preview-divider { width:1px; height:36px; background: var(--border); }

  .submit-btn { margin-top:20px; width:100%; padding:12px 0; border-radius:8px; border:none; background: var(--walnut); color: var(--bg); font-family:'Cairo',sans-serif; font-weight:700; font-size:15px; cursor:pointer; }
  .submit-btn:disabled { opacity:0.6; cursor:default; }

  .log-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .export-btn { display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; border:1px solid var(--amber); background:#fff; color: var(--walnut); font-family:'Tajawal',sans-serif; font-weight:700; font-size:13px; cursor:pointer; }

  table { width:100%; border-collapse:collapse; font-size:13px; min-width:720px; }
  th { text-align:right; background:#F1E4D0; color: var(--walnut-dark); padding:10px; font-weight:700; border-bottom:1px solid var(--border); white-space:nowrap; }
  td { padding:9px 10px; border-bottom:1px solid var(--border-soft); white-space:nowrap; }
  .table-wrap { overflow-x:auto; }
  .delete-btn { border:none; background:transparent; color: var(--danger); cursor:pointer; padding:4px; font-size:14px; }
  .empty-row { text-align:center; padding:24px 0; color: var(--muted); }

  .settings-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:16px; }
  ul.list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .list-item { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; background:#F6EFE3; border-radius:6px; font-size:13px; }
  .small-delete { border:none; background:transparent; color: var(--danger); cursor:pointer; }
  .add-row { display:flex; gap:8px; }
  .add-btn { display:flex; align-items:center; justify-content:center; padding:0 14px; border-radius:8px; border:none; background: var(--walnut); color: var(--bg); cursor:pointer; font-family:'Tajawal',sans-serif; font-weight:700; font-size:13px; }
  .note { margin-top:10px; font-size:12px; color: var(--muted); }
  .footer { text-align:center; font-size:12px; color: var(--muted); padding:0 16px 24px; }

  .setup-card { max-width:640px; margin:48px auto; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:28px; }
  .setup-card h2 { font-family:'Cairo',sans-serif; color:var(--walnut-dark); margin-top:0; }
  .setup-card code { background:#F1E4D0; padding:2px 6px; border-radius:4px; font-size:13px; }
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ============ اضبط ده أول حاجة ============ */
const CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbwuUpp4eCD_oEAI9RQJyDu_D7tclQUWThf0C_m1TiYYzTfmw7IIyJYkhJgHH2pUfTZ6/exec"
};
/* =========================================== */

const DEFAULT_SETTINGS = {
  supervisors: ["مشرف 1","مشرف 2","مشرف 3","مشرف 4","مشرف 5","مشرف 6","مشرف 7","مشرف 8","مشرف 9","مشرف 10"],
  departments: ["نجارة","دهان","تنجيد","أرزة"],
  hourlyRate: 0
};

let STATE = { loading: true, settings: DEFAULT_SETTINGS, entries: [], tab: "new", saving: false, error: "" };
let FORM = { supervisor: "", orderNo: "", department: "", workers: "", start: "", end: "", breakMin: "" };

function timeToMinutes(t) {
  if (!t) return null;
  const parts = t.split(":").map(Number);
  if (parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) return null;
  return parts[0]*60 + parts[1];
}
function computeHours(start, end, breakMin, workers) {
  const s = timeToMinutes(start), e = timeToMinutes(end);
  const b = Number(breakMin)||0, w = Number(workers)||0;
  if (s===null || e===null) return { actualHours:0, laborHours:0 };
  let diff = e - s;
  if (diff < 0) diff += 1440;
  diff -= b;
  if (diff < 0) diff = 0;
  const actualHours = diff/60;
  return { actualHours, laborHours: actualHours*w };
}

async function apiGet(action, params) {
  const url = new URL(CONFIG.SCRIPT_URL);
  url.searchParams.set("action", action);
  if (params) Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const res = await fetch(url.toString());
  return res.json();
}
async function apiPost(action, payload) {
  const res = await fetch(CONFIG.SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(Object.assign({ action }, payload||{}))
  });
  return res.json();
}

async function loadAll(silent) {
  if (!silent) { STATE.loading = true; render(); }
  try {
    const data = await apiGet("getData");
    if (data.error) throw new Error(data.error);
    STATE.settings = data.settings || DEFAULT_SETTINGS;
    STATE.entries = data.entries || [];
    if (!FORM.supervisor) FORM.supervisor = STATE.settings.supervisors[0] || "";
    if (!FORM.department) FORM.department = STATE.settings.departments[0] || "";
    STATE.error = "";
  } catch (e) {
    STATE.error = "تعذر الاتصال بجوجل شيت. تأكد إن الرابط في CONFIG.SCRIPT_URL مظبوط والنشر شغال.";
  }
  STATE.loading = false;
  render();
}

async function handleSubmit(ev) {
  ev.preventDefault();
  if (!FORM.supervisor || !FORM.orderNo || !FORM.department || !FORM.start || !FORM.end) {
    STATE.error = "من فضلك املأ المشرف ورقم الطلب والقسم ووقت البداية والنهاية";
    render();
    return;
  }
  STATE.error = "";
  STATE.saving = true;
  render();
  const { actualHours, laborHours } = computeHours(FORM.start, FORM.end, FORM.breakMin, FORM.workers);
  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    date: new Date().toISOString().slice(0,10),
    supervisor: FORM.supervisor,
    orderNo: FORM.orderNo,
    department: FORM.department,
    workers: Number(FORM.workers)||0,
    start: FORM.start,
    end: FORM.end,
    breakMin: Number(FORM.breakMin)||0,
    actualHours, laborHours
  };
  try {
    await apiPost("addEntry", { entry });
    FORM.orderNo = ""; FORM.workers = ""; FORM.start = ""; FORM.end = ""; FORM.breakMin = "";
    await loadAll(true);
  } catch(e) {
    STATE.error = "تعذر حفظ التسجيلة، حاول تاني";
  }
  STATE.saving = false;
  render();
}

async function handleDelete(id) {
  try {
    await apiPost("deleteEntry", { id });
    await loadAll(true);
  } catch(e) {
    STATE.error = "تعذر حذف التسجيلة";
    render();
  }
}

async function saveSettings(next) {
  STATE.settings = next;
  render();
  try {
    await apiPost("saveSettings", { settings: next });
  } catch(e) {
    STATE.error = "تعذر حفظ الإعدادات";
    render();
  }
}

function exportExcel() {
  const rows = STATE.entries.map(en => ({
    "التاريخ": en.date, "المشرف": en.supervisor, "رقم الطلب": en.orderNo, "القسم": en.department,
    "عدد العمال": en.workers, "من": en.start, "الى": en.end, "الاستراحة (دقيقة)": en.breakMin,
    "الساعات الفعلية": Number(Number(en.actualHours).toFixed(2)),
    "ساعات العمل": Number(Number(en.laborHours).toFixed(2)),
    "تكلفة العمالة": Number((Number(en.laborHours) * (STATE.settings.hourlyRate||0)).toFixed(2))
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "السجل");
  XLSX.writeFile(wb, "سجل_ساعات_العمل.xlsx");
}

function computeSummary() {
  const byOrder = {};
  STATE.entries.forEach(en => {
    if (!byOrder[en.orderNo]) byOrder[en.orderNo] = {};
    byOrder[en.orderNo][en.department] = (byOrder[en.orderNo][en.department]||0) + Number(en.laborHours);
  });
  return Object.entries(byOrder).map(([orderNo, depts]) => {
    const total = Object.values(depts).reduce((a,b)=>a+b,0);
    return { orderNo, depts, total, cost: total*(STATE.settings.hourlyRate||0) };
  });
}

function esc(s) { const d=document.createElement("div"); d.innerText = s==null?"":s; return d.innerHTML; }

function render() {
  const app = document.getElementById("app");

  if (CONFIG.SCRIPT_URL.includes("PASTE_YOUR")) {
    app.innerHTML = `
      <div class="setup-card">
        <h2>خطوة إعداد ناقصة</h2>
        <p>لازم تحط رابط جوجل أبس سكريبت في متغير <code>CONFIG.SCRIPT_URL</code> جوه ملف index.html.</p>
        <p>اتبع خطوات ملف google_apps_script.gs.txt عشان تعمل النشر وتجيب الرابط.</p>
      </div>`;
    return;
  }

  if (STATE.loading) {
    app.innerHTML = `<div class="loading-wrap"><span class="spin">⏳</span><span>جاري تحميل البيانات...</span></div>`;
    return;
  }

  const tabs = [
    { id:"new", label:"تسجيل جديد" },
    { id:"log", label:"السجل" },
    { id:"summary", label:"الملخص" },
    { id:"settings", label:"الإعدادات" }
  ];

  let html = `
    <div class="header"><div class="header-inner">
      <span style="font-size:26px;">🔨</span>
      <div><h1 class="title">دفتر الورشة</h1><p class="subtitle">متابعة ساعات الإنتاج لكل طلب بيع</p></div>
    </div></div>
    <nav class="tabs">
      ${tabs.map(t=>`<button class="tab-btn ${STATE.tab===t.id?'active':''}" onclick="setTab('${t.id}')">${t.label}</button>`).join("")}
    </nav>
    ${STATE.error ? `<div class="error-banner">${esc(STATE.error)}</div>` : ""}
    <main>`;

  if (STATE.tab === "new") {
    const preview = computeHours(FORM.start, FORM.end, FORM.breakMin, FORM.workers);
    html += `
      <form class="card" id="entryForm">
        <div class="grid2">
          <label class="field"><span class="field-label">المشرف</span>
            <select onchange="FORM.supervisor=this.value">
              ${STATE.settings.supervisors.map(s=>`<option value="${esc(s)}" ${FORM.supervisor===s?'selected':''}>${esc(s)}</option>`).join("")}
            </select>
          </label>
          <label class="field"><span class="field-label">رقم الطلب</span>
            <input class="input" value="${esc(FORM.orderNo)}" oninput="FORM.orderNo=this.value" placeholder="مثال: 1024">
          </label>
          <label class="field"><span class="field-label">القسم</span>
            <select onchange="FORM.department=this.value">
              ${STATE.settings.departments.map(d=>`<option value="${esc(d)}" ${FORM.department===d?'selected':''}>${esc(d)}</option>`).join("")}
            </select>
          </label>
          <label class="field"><span class="field-label">عدد العمال</span>
            <input type="number" min="0" class="input" value="${esc(FORM.workers)}" oninput="FORM.workers=this.value; renderPreview();" placeholder="0">
          </label>
          <label class="field"><span class="field-label">وقت البداية</span>
            <input type="time" class="input" value="${esc(FORM.start)}" oninput="FORM.start=this.value; renderPreview();">
          </label>
          <label class="field"><span class="field-label">وقت النهاية</span>
            <input type="time" class="input" value="${esc(FORM.end)}" oninput="FORM.end=this.value; renderPreview();">
          </label>
          <label class="field"><span class="field-label">الاستراحة (دقيقة)</span>
            <input type="number" min="0" class="input" value="${esc(FORM.breakMin)}" oninput="FORM.breakMin=this.value; renderPreview();" placeholder="0">
          </label>
        </div>
        <div class="preview-box" id="previewBox">
          <div class="preview-item"><span class="preview-label">الساعات الفعلية</span><span class="preview-value">${preview.actualHours.toFixed(2)}</span></div>
          <div class="preview-divider"></div>
          <div class="preview-item"><span class="preview-label">ساعات العمل</span><span class="preview-value">${preview.laborHours.toFixed(2)}</span></div>
        </div>
        <button type="submit" class="submit-btn" ${STATE.saving?'disabled':''}>${STATE.saving?'جاري التسجيل...':'تسجيل'}</button>
      </form>`;
  }

  if (STATE.tab === "log") {
    html += `
      <div class="card">
        <div class="log-header">
          <h2 class="card-title">السجل (${STATE.entries.length})</h2>
          <button class="export-btn" onclick="exportExcel()">⬇ تصدير Excel</button>
        </div>
        <div class="table-wrap"><table>
          <thead><tr>${["التاريخ","المشرف","رقم الطلب","القسم","العمال","من","الى","استراحة","ساعات فعلية","ساعات عمل",""].map(h=>`<th>${h}</th>`).join("")}</tr></thead>
          <tbody>
            ${STATE.entries.slice().reverse().map(en=>`
              <tr>
                <td>${esc(en.date)}</td><td>${esc(en.supervisor)}</td><td>${esc(en.orderNo)}</td><td>${esc(en.department)}</td>
                <td>${esc(en.workers)}</td><td>${esc(en.start)}</td><td>${esc(en.end)}</td><td>${esc(en.breakMin)}</td>
                <td>${Number(en.actualHours).toFixed(2)}</td><td>${Number(en.laborHours).toFixed(2)}</td>
                <td><button class="delete-btn" onclick="handleDelete('${en.id}')">✕</button></td>
              </tr>`).join("")}
            ${STATE.entries.length===0 ? `<tr><td colspan="11" class="empty-row">لسه مفيش تسجيلات</td></tr>` : ""}
          </tbody>
        </table></div>
      </div>`;
  }

  if (STATE.tab === "summary") {
    const summary = computeSummary();
    html += `
      <div class="card">
        <h2 class="card-title">ملخص حسب رقم الطلب</h2>
        <div class="table-wrap"><table>
          <thead><tr><th>رقم الطلب</th>${STATE.settings.departments.map(d=>`<th>${esc(d)}</th>`).join("")}<th>إجمالي ساعات العمل</th><th>تكلفة العمالة</th></tr></thead>
          <tbody>
            ${summary.map(row=>`
              <tr>
                <td>${esc(row.orderNo)}</td>
                ${STATE.settings.departments.map(d=>`<td>${(row.depts[d]||0).toFixed(2)}</td>`).join("")}
                <td style="font-weight:700">${row.total.toFixed(2)}</td>
                <td style="font-weight:700; color:var(--walnut)">${row.cost.toFixed(2)}</td>
              </tr>`).join("")}
            ${summary.length===0 ? `<tr><td colspan="${STATE.settings.departments.length+3}" class="empty-row">لسه مفيش بيانات</td></tr>` : ""}
          </tbody>
        </table></div>
      </div>`;
  }

  if (STATE.tab === "settings") {
    html += `
      <div class="settings-grid">
        <div class="card">
          <h2 class="card-title">المشرفين</h2>
          <ul class="list">
            ${STATE.settings.supervisors.map(s=>`
              <li class="list-item"><span>${esc(s)}</span><button class="small-delete" onclick="removeSupervisor('${esc(s)}')">✕</button></li>`).join("")}
          </ul>
          <div class="add-row">
            <input class="input" id="newSupervisor" placeholder="اسم مشرف جديد">
            <button class="add-btn" onclick="addSupervisor()">+</button>
          </div>
        </div>
        <div class="card">
          <h2 class="card-title">الأقسام</h2>
          <ul class="list">
            ${STATE.settings.departments.map(d=>`
              <li class="list-item"><span>${esc(d)}</span><button class="small-delete" onclick="removeDept('${esc(d)}')">✕</button></li>`).join("")}
          </ul>
          <div class="add-row">
            <input class="input" id="newDept" placeholder="اسم قسم جديد">
            <button class="add-btn" onclick="addDept()">+</button>
          </div>
        </div>
        <div class="card">
          <h2 class="card-title">سعر الساعة</h2>
          <div class="add-row">
            <input type="number" min="0" class="input" id="rateInput" value="${STATE.settings.hourlyRate}">
            <button class="add-btn" onclick="saveRate()">حفظ</button>
          </div>
          <p class="note">جنيه لكل ساعة عمل. بيتضرب في إجمالي ساعات العمل لحساب التكلفة في الملخص.</p>
        </div>
      </div>`;
  }

  html += `</main><footer class="footer">البيانات هنا محفوظة في جوجل شيت ومشتركة بين كل المشرفين</footer>`;
  app.innerHTML = html;

  const form = document.getElementById("entryForm");
  if (form) form.addEventListener("submit", handleSubmit);
}

function renderPreview() {
  const preview = computeHours(FORM.start, FORM.end, FORM.breakMin, FORM.workers);
  const box = document.getElementById("previewBox");
  if (box) {
    box.innerHTML = `
      <div class="preview-item"><span class="preview-label">الساعات الفعلية</span><span class="preview-value">${preview.actualHours.toFixed(2)}</span></div>
      <div class="preview-divider"></div>
      <div class="preview-item"><span class="preview-label">ساعات العمل</span><span class="preview-value">${preview.laborHours.toFixed(2)}</span></div>`;
  }
}

function setTab(id) { STATE.tab = id; STATE.error = ""; render(); }

function addSupervisor() {
  const input = document.getElementById("newSupervisor");
  const val = input.value.trim();
  if (val) saveSettings(Object.assign({}, STATE.settings, { supervisors: [...STATE.settings.supervisors, val] }));
}
function removeSupervisor(name) {
  saveSettings(Object.assign({}, STATE.settings, { supervisors: STATE.settings.supervisors.filter(s=>s!==name) }));
}
function addDept() {
  const input = document.getElementById("newDept");
  const val = input.value.trim();
  if (val) saveSettings(Object.assign({}, STATE.settings, { departments: [...STATE.settings.departments, val] }));
}
function removeDept(name) {
  saveSettings(Object.assign({}, STATE.settings, { departments: STATE.settings.departments.filter(d=>d!==name) }));
}
function saveRate() {
  const val = Number(document.getElementById("rateInput").value) || 0;
  saveSettings(Object.assign({}, STATE.settings, { hourlyRate: val }));
}

render();
loadAll();
setInterval(() => { if (STATE.tab==="log" || STATE.tab==="summary") loadAll(true); }, 20000);
</script>
</body>
</html>
