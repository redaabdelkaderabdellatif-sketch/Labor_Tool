<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaty Cost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8F9FA; --panel: #FFFFFF; --ink: #212529;
    --walnut: #714B67; --walnut-dark: #5B3A54; --amber: #017E84;
    --border: #E0E0E0; --border-soft: #EEEEEE; --muted: #6C757D;
    --danger: #DC3545; --danger-bg: #FDEDEE; --danger-border: #F5C2C7;

  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
  .loading-wrap { display:flex; align-items:center; justify-content:center; padding:48px 16px; color: var(--walnut); gap:8px; }

  .header { background: var(--walnut); padding: 20px 24px; }
  .header-inner { display:flex; align-items:center; justify-content:space-between; gap:12px; max-width:1100px; margin:0 auto; flex-wrap:wrap; }
  .header-left { display:flex; align-items:center; gap:12px; }
  .title { font-family:'Cairo',sans-serif; font-weight:800; font-size:22px; color: var(--bg); margin:0; }
  .lang-switch { display:flex; gap:4px; }
  .lang-btn { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.3); color:#F8F9FA; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:12px; font-family:'Tajawal',sans-serif; }
  .lang-btn.active { background:#fff; color:var(--walnut); font-weight:700; }
  .logout-btn { background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.3); color:#F8F9FA; padding:8px 14px; border-radius:8px; cursor:pointer; font-family:'Tajawal',sans-serif; font-size:13px; }
  .whoami { color:#EDE4EA; font-size:13px; }
  .role-badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; background:#EDE4EA; color:var(--walnut-dark); }

  .tab-btn { display:flex; align-items:center; gap:6px; padding:10px 16px; background:transparent; border:none; border-bottom:3px solid transparent; color: var(--muted); font-family:inherit; font-size:14px; font-weight:500; cursor:pointer; }
  .tab-btn.active { color: var(--walnut); border-bottom:3px solid var(--amber); font-weight:700; }

  .grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:14px; }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field-label { font-size:13px; color: var(--muted); font-weight:500; }
  .input, select { font-family:inherit; font-size:14px; padding:10px 12px; border-radius:8px; border:1px solid #CED4DA; background:#fff; color: var(--ink); outline:none; width:100%; }
  .locked-box { padding:10px 12px; border-radius:8px; background:#EDE4EA; color: var(--walnut-dark); font-weight:700; }
  .time-pair { display:flex; align-items:center; gap:6px; }
  .time-pair select { width:auto; flex:1; text-align:center; }
  .time-colon { font-weight:700; color: var(--muted); }

  .preview-box { margin-top:20px; display:flex; align-items:center; justify-content:center; gap:24px; background:#E8F5F5; border:1px dashed var(--amber); border-radius:10px; padding:16px 20px; flex-wrap:wrap; }
  .preview-item { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .preview-label { font-size:12px; color: var(--muted); }
  .preview-value { font-family:'Cairo',sans-serif; font-size:24px; font-weight:800; color: var(--walnut); }
  .preview-divider { width:1px; height:36px; background: var(--border); }

  .submit-btn { margin-top:20px; width:100%; padding:12px 0; border-radius:8px; border:none; background: var(--walnut); color: var(--bg); font-family:'Cairo',sans-serif; font-weight:700; font-size:15px; cursor:pointer; }
  .submit-btn:disabled { opacity:0.6; cursor:default; }

  .log-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .export-btn { display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; border:1px solid var(--amber); background:#fff; color: var(--walnut); font-family:inherit; font-weight:700; font-size:13px; cursor:pointer; }

  table { width:100%; border-collapse:collapse; font-size:13px; min-width:680px; }
  th { text-align:start; background:#EDE4EA; color: var(--walnut-dark); padding:10px; font-weight:700; border-bottom:1px solid var(--border); white-space:nowrap; }
  td { padding:9px 10px; border-bottom:1px solid var(--border-soft); white-space:nowrap; }
  .table-wrap { overflow-x:auto; }
  .delete-btn { border:none; background:transparent; color: var(--danger); cursor:pointer; padding:4px; font-size:14px; }
  .empty-row { text-align:center; padding:24px 0; color: var(--muted); }
  .verify-check { width:18px; height:18px; cursor:pointer; }

  .settings-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:16px; }
  ul.list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
  .list-item { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; background:#E8F5F5; border-radius:6px; font-size:13px; gap:8px; }
  .list-item-actions { display:flex; gap:6px; flex-shrink:0; }
  .small-delete { border:none; background:transparent; color: var(--danger); cursor:pointer; }
  .small-edit { border:none; background:transparent; color: var(--walnut); cursor:pointer; }
  .add-row { display:flex; gap:8px; }
  .add-btn { display:flex; align-items:center; justify-content:center; padding:0 14px; border-radius:8px; border:none; background: var(--walnut); color: var(--bg); cursor:pointer; font-family:inherit; font-weight:700; font-size:13px; }
  .footer { text-align:center; font-size:12px; color: var(--muted); padding:0 16px 24px; }

  .setup-card { max-width:640px; margin:48px auto; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:28px; }
  .setup-card h2 { font-family:'Cairo',sans-serif; color:var(--walnut-dark); margin-top:0; }
  .setup-card code { background:#EDE4EA; padding:2px 6px; border-radius:4px; font-size:13px; }

  .auth-wrap { max-width:380px; margin:70px auto; padding:0 16px; }
  .auth-card { background: var(--panel); border:1px solid var(--border); border-radius:14px; padding:28px; box-shadow:0 2px 8px rgba(74,46,25,0.08); text-align:center; }
  .auth-title { font-family:'Cairo',sans-serif; font-size:20px; font-weight:800; color: var(--walnut-dark); margin:0 0 4px; }
</style>
